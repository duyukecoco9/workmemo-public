services:
  - type: web
    name: workmemo
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: WORKMEMO_ACCESS_CODE
        sync: false
      - key: WORKMEMO_SESSION_SECRET
        sync: false
      - key: WORKMEMO_REMOTE_DATA
        value: 1
      - key: WORKMEMO_DATA_FILE
        value: /var/data/workmemo-data.json
      - key: AI_TARGET
        value: https://api.moonshot.cn/v1
    disk:
      name: workmemo-data
      mountPath: /var/data
      sizeGB: 1
