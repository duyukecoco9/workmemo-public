  // ===================== 企业微信推送（群机器人 webhook，经本地服务中转） =====================
  async saveWecomSettings() {
    await db.setSetting('wecomWebhookKey', ($('#settingWecomKey').value || '').trim());
    const defs = [
      { id: 'morning', label: '早间推送（今日日程 + 本周重点待办 + 逾期）' },
      { id: 'noon', label: '午间推送（下午安排 + 今日未完成）' },
    ];
    const pushes = defs.map(d => ({
      id: d.id, label: d.label,
      on: !!($('#wecomPush_' + d.id) && $('#wecomPush_' + d.id).checked),
      time: ($('#wecomPushTime_' + d.id) && $('#wecomPushTime_' + d.id).value) || (d.id === 'morning' ? '08:30' : '13:00'),
    }));
    await db.setSetting('wecomPushes', pushes);
    await db.setSetting('wecomMeetingEnabled', $('#settingWecomMeeting').checked);
    this.startWecomLoop();
    showToast('企业微信提醒设置已保存', 'success');
  },

  async wecomTest() {
    const key = ($('#settingWecomKey') ? $('#settingWecomKey').value.trim() : '') || await db.getSetting('wecomWebhookKey', '');
    if (!key) { showToast('请先填写 Webhook Key', 'warning'); return; }
    const r = await this._wecomSend(key, { msgtype: 'text', text: { content: 'WorkMemo 测试消息：企业微信推送通道正常 ✅' } });
    if (r && r.errcode === 0) showToast('测试消息已发送，请到群里查看', 'success');
    else showToast('发送失败：' + ((r && (r.errmsg || r.error)) || '网络错误'), 'error');
  },

  async _wecomSend(key, msg) {
    try {
      const resp = await fetch('/api/wecom-push', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: key, payload: msg })
      });
      return await resp.json();
    } catch (e) {
      return { errcode: -1, error: e.message };
    }
  },

  startWecomLoop() {
    if (this._wecomTimer) return;
    this._wecomTimer = setInterval(() => { this._wecomTick().catch(() => {}); this._reportTick().catch(() => {}); }, 30000);
    this._wecomTick().catch(() => {});
    this._reportTick().catch(() => {});
  },

  async _wecomTick() {
    const key = await db.getSetting('wecomWebhookKey', '');
    if (!key) return;
    const now = new Date();

    // 定时推送（早 / 午；晚间推送已由「日报」取代）
    let pushes = await db.getSetting('wecomPushes', null);
    if (!pushes) {
      pushes = [{ id: 'morning', time: await db.getSetting('wecomDailyTime', '08:30'), on: await db.getSetting('wecomDailyEnabled', false) }];
    }
    pushes = pushes.filter(p => p.id !== 'evening');
    const builders = { morning: '_buildDailyDigest', noon: '_buildNoonDigest' };
    const nowMin = now.getHours() * 60 + now.getMinutes();
    for (const ps of pushes) {
      if (!ps.on || !ps.time) continue;
      const t = ps.time.split(':');
      const dueMin = (parseInt(t[0]) || 0) * 60 + (parseInt(t[1]) || 0);
      const lastKey = 'wecomLastPush_' + ps.id;
      const last = await db.getSetting(lastKey, '');
      if (dateToStr(now) === last || nowMin < dueMin) continue;
      const builder = builders[ps.id] || '_buildDailyDigest';
      const r = await this._wecomSend(key, { msgtype: 'markdown', markdown: { content: this[builder]() } });
      if (r && r.errcode === 0) await db.setSetting(lastKey, dateToStr(now));
    }

    // 会议开始前推送（按每条会议的提醒提前量，默认 15 分钟）
    if (await db.getSetting('wecomMeetingEnabled', false)) {
      const nowMs = now.getTime();
      for (const i of this.data.workItems) {
        if (i.type !== 'meeting' || !i.datetime || i.done) continue;
        const remind = (i.reminderMinutes || 15) * 60000;
        const t = new Date(i.datetime).getTime();
        const diff = t - nowMs;
        if (diff <= 0 || diff > remind) continue;
        const dedupKey = 'wecomPushed_' + i.id + '_' + i.datetime;
        if (await db.getSetting(dedupKey, false)) continue;
        const content = '⏰ 会议提醒：' + i.title + '\n时间：' + fmtDateTime(i.datetime) + '\n项目：' + this.projectName(i.projectId) + (i.note ? '\n备注：' + i.note.slice(0, 100) : '');
        const r = await this._wecomSend(key, { msgtype: 'text', text: { content: content } });
        if (r && r.errcode === 0) await db.setSetting(dedupKey, true);
      }
    }
  },

  _buildDailyDigest() {
    const now = new Date();
    const today = dateToStr(now);
    const weekEnd = dateToStr(new Date(now.getTime() + 7 * 86400000));
    const weekCN = ['日', '一', '二', '三', '四', '五', '六'][now.getDay()];
    const label = (i) => '【' + this.projectName(i.projectId) + '】' + i.title;
    const hhmm = (d) => { const t = new Date(d); return String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0'); };

    const todayItems = this.data.workItems
      .filter(i => i.datetime && dayStrOf(i.datetime) === today)
      .sort((a, b) => a.datetime < b.datetime ? -1 : 1);
    const weekTodos = this.data.workItems
      .filter(i => !i.done && i.datetime && dayStrOf(i.datetime) > today && dayStrOf(i.datetime) <= weekEnd)
      .sort((a, b) => a.datetime < b.datetime ? -1 : 1);
    const overdue = this.data.workItems
      .filter(i => !i.done && i.datetime && dayStrOf(i.datetime) < today)
      .sort((a, b) => a.datetime < b.datetime ? -1 : 1);

    const section = (arr, fmt, max) => {
      if (!arr.length) return '无';
      let s = arr.slice(0, max || 8).map(fmt).join('\n');
      if (arr.length > (max || 8)) s += '\n<font color="comment">…还有 ' + (arr.length - (max || 8)) + ' 条</font>';
      return s;
    };

    let md = '## 📅 今日日程 ' + (now.getMonth() + 1) + '月' + now.getDate() + '日 周' + weekCN + '\n';
    md += section(todayItems, i => '> ' + (i.datetime ? hhmm(i.datetime) : '全天') + ' ' + i.title + '（' + this.projectName(i.projectId) + '）' + (i.done ? ' ✅' : '')) + '\n';
    md += '## 🎯 本周重点待办（' + weekTodos.length + '）\n';
    md += section(weekTodos, i => '> ' + (dayStrOf(i.datetime).slice(5).replace('-', '/')) + ' ' + label(i)) + '\n';
    md += '## ⚠️ 逾期未跟进（' + overdue.length + '）\n';
    md += section(overdue, i => '> <font color="warning">' + (dayStrOf(i.datetime).slice(5).replace('-', '/')) + '</font> ' + label(i), 5) + '\n';
    md += '<font color="comment">—— WorkMemo 每日推送</font>';
    return md.slice(0, 3800);
  },

  _digestHelpers(now) {
    const pad = (n) => String(n).padStart(2, '0');
    return {
      weekCN: '周' + ['日', '一', '二', '三', '四', '五', '六'][now.getDay()],
      hhmm: (d) => { const t = new Date(d); return pad(t.getHours()) + ':' + pad(t.getMinutes()); },
      label: (i) => '【' + this.projectName(i.projectId) + '】' + i.title,
      section: (arr, fmt, max) => {
        if (!arr.length) return '无';
        let s = arr.slice(0, max || 8).map(fmt).join('\n');
        if (arr.length > (max || 8)) s += '\n<font color="comment">…还有 ' + (arr.length - (max || 8)) + ' 条</font>';
        return s;
      }
    };
  },

  _buildNoonDigest() {
    const now = new Date();
    const today = dateToStr(now);
    const H = this._digestHelpers(now);
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const rest = this.data.workItems
      .filter(i => i.datetime && dayStrOf(i.datetime) === today && !i.done)
      .filter(i => { const t = new Date(i.datetime); return t.getHours() * 60 + t.getMinutes() >= nowMin; })
      .sort((a, b) => a.datetime < b.datetime ? -1 : 1);
    const todayUndone = this.data.workItems
      .filter(i => i.datetime && dayStrOf(i.datetime) === today && !i.done)
      .sort((a, b) => a.datetime < b.datetime ? -1 : 1);
    const noDate = this.data.workItems.filter(i => !i.done && !i.datetime);

    let md = '## 🍚 午间提醒 ' + (now.getMonth() + 1) + '月' + now.getDate() + '日 ' + H.weekCN + '\n';
    md += '### 下午及晚间安排（' + rest.length + '）\n';
    md += H.section(rest, i => '> ' + H.hhmm(i.datetime) + ' ' + i.title + '（' + this.projectName(i.projectId) + '）') + '\n';
    md += '### 今天还没完成（' + todayUndone.length + '）\n';
    md += H.section(todayUndone, i => '> ' + H.hhmm(i.datetime) + ' ' + H.label(i)) + '\n';
    if (noDate.length) md += '<font color="comment">另有 ' + noDate.length + ' 条无日期待办在「还要做」区</font>\n';
    md += '<font color="comment">—— WorkMemo 午间推送</font>';
    return md.slice(0, 3800);
  },

  _buildEveningDigest() {
    const now = new Date();
    const today = dateToStr(now);
    const tomorrow = dateToStr(new Date(now.getTime() + 86400000));
    const tmr = new Date(now.getTime() + 86400000);
    const H = this._digestHelpers(now);
    const tmrWeek = '周' + ['日', '一', '二', '三', '四', '五', '六'][tmr.getDay()];

    const doneToday = this.data.workItems
      .filter(i => i.done && i.doneAt && dayStrOf(i.doneAt) === today)
      .sort((a, b) => (a.doneAt < b.doneAt ? -1 : 1));
    const tomorrowItems = this.data.workItems
      .filter(i => i.datetime && dayStrOf(i.datetime) === tomorrow)
      .sort((a, b) => a.datetime < b.datetime ? -1 : 1);
    const openTodos = this.data.workItems
      .filter(i => !i.done && (!i.datetime || dayStrOf(i.datetime) <= tomorrow))
      .sort((a, b) => this.itemSortKey(a) < this.itemSortKey(b) ? -1 : 1);

    let md = '## 🌙 今日总结 ' + (now.getMonth() + 1) + '月' + now.getDate() + '日 ' + H.weekCN + '\n';
    md += '### ✅ 今天完成（' + doneToday.length + '）\n';
    md += H.section(doneToday, i => '> ' + H.label(i)) + '\n';
    md += '### 📅 明天安排 ' + (tmr.getMonth() + 1) + '月' + tmr.getDate() + '日 ' + tmrWeek + '（' + tomorrowItems.length + '）\n';
    md += H.section(tomorrowItems, i => '> ' + H.hhmm(i.datetime) + ' ' + i.title + '（' + this.projectName(i.projectId) + '）') + '\n';
    md += '### ⏳ 明天要继续推进（' + openTodos.length + '）\n';
    md += H.section(openTodos, i => '> ' + (i.datetime ? '<font color="warning">' + dayStrOf(i.datetime).slice(5).replace('-', '/') + '</font> ' : '') + H.label(i), 8) + '\n';
    md += '<font color="comment">—— WorkMemo 晚间总结</font>';
    return md.slice(0, 3800);
  },

  // ===================== 定时报告（日报 / 周报 / 月报，存入「报告」菜单） =====================
  async _getReportCfgs() {
    let cfgs = await db.getSetting('reportCfgs', null);
    if (!cfgs) {
      // 迁移：日报取代原晚间推送（晚报开着的话，日报继承其开关与推送设置）
      const pushes = (await db.getSetting('wecomPushes', null)) || [];
      const ev = pushes.find(p => p.id === 'evening') || {};
      cfgs = [
        { type: 'daily', time: '20:00', on: !!ev.on, push: !!ev.on },
        { type: 'weekly', time: '09:00', on: true, push: false },
        { type: 'monthly', time: '22:00', on: true, push: false },
      ];
      await db.setSetting('reportCfgs', cfgs);
    }
    return cfgs;
  },

  async saveReportSettings() {
    const cfgs = await this._getReportCfgs();
    cfgs.forEach(c => {
      const onEl = $('#reportOn_' + c.type), tEl = $('#reportTime_' + c.type), pEl = $('#reportPush_' + c.type);
      if (onEl) c.on = onEl.checked;
      if (tEl && tEl.value) c.time = tEl.value;
      if (pEl) c.push = pEl.checked;
    });
    await db.setSetting('reportCfgs', cfgs);
    showToast('报告设置已保存', 'success');
  },

  async _reportTick() {
    const cfgs = await this._getReportCfgs();
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const today = dateToStr(now);
    const isLastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate() === now.getDate();
    for (const cfg of cfgs) {
      if (!cfg.on) continue;
      if (cfg.type === 'weekly' && now.getDay() !== 6) continue;   // 周报：周六
      if (cfg.type === 'monthly' && !isLastDay) continue;          // 月报：每月最后一天
      const t = (cfg.time || '20:00').split(':');
      const dueMin = (parseInt(t[0]) || 0) * 60 + (parseInt(t[1]) || 0);
      if (nowMin < dueMin) continue;
      const periodKey = cfg.type === 'monthly' ? today.slice(0, 7) : today;
      const lastKey = 'reportLast_' + cfg.type;
      if (await db.getSetting(lastKey, '') === periodKey) continue;
      try {
        const r = await this.generateReport(cfg.type, true);
        if (!r) continue;
        await db.setSetting(lastKey, periodKey);
        if (cfg.push) {
          const key = await db.getSetting('wecomWebhookKey', '');
          if (key) await this._wecomSend(key, { msgtype: 'markdown', markdown: { content: (r.pushContent || r.title).slice(0, 3800) } });
        }
        showToast(r.title + ' 已生成，存入「报告」菜单', 'success');
        if (this.page === 'reports') this.renderReports();
      } catch (e) { console.warn('报告生成失败', cfg.type, e); }
    }
  },

  async generateReport(type, silent) {
    const builders = { daily: '_buildDailyReport', weekly: '_buildWeeklyReport', monthly: '_buildMonthlyReport' };
    const fn = this[builders[type]];
    if (!fn) return null;
    const r = await fn.call(this);
    const id = await db.add('reports', { type: type, title: r.title, period: r.period, content: r.content });
    if (!silent) {
      showToast(r.title + ' 已生成', 'success');
      if (this.page === 'reports') this.renderReports();
    }
    return Object.assign({ id: id }, r);
  },

  async _aiSummary(promptText, sys) {
    try {
      const apiKey = await db.getSetting('apiKey', '');
      if (!apiKey) return '';
      return await callAI([{ role: 'user', content: promptText }], null, sys);
    } catch (e) { console.warn('AI 小结生成失败:', e); return ''; }
  },

  // ---- 日报（每天，默认 20:00）----
  async _buildDailyReport() {
    const now = new Date();
    const today = dateToStr(now);
    const tomorrow = dateToStr(new Date(now.getTime() + 86400000));
    const H = this._digestHelpers(now);
    const line = (i) => '- 【' + this.projectName(i.projectId) + '】' + i.title;
    const doneToday = this.data.workItems.filter(i => i.done && i.doneAt && dayStrOf(i.doneAt) === today)
      .sort((a, b) => a.doneAt < b.doneAt ? -1 : 1);
    const meetingsToday = this.data.workItems.filter(i => i.type === 'meeting' && i.datetime && dayStrOf(i.datetime) === today)
      .sort((a, b) => a.datetime < b.datetime ? -1 : 1);
    const missed = this.data.workItems.filter(i => !i.done && i.datetime && dayStrOf(i.datetime) <= today)
      .sort((a, b) => a.datetime < b.datetime ? -1 : 1);
    const tomorrowItems = this.data.workItems.filter(i => i.datetime && dayStrOf(i.datetime) === tomorrow)
      .sort((a, b) => a.datetime < b.datetime ? -1 : 1);
    const noDate = this.data.workItems.filter(i => !i.done && !i.datetime);

    let md = '# 日报 · ' + (now.getMonth() + 1) + '月' + now.getDate() + '日 ' + H.weekCN + '\n\n';
    md += '## ✅ 今日完成（' + doneToday.length + '）\n' + (doneToday.length ? doneToday.map(line).join('\n') : '无') + '\n\n';
    md += '## 📅 今日会议（' + meetingsToday.length + '）\n' + (meetingsToday.length ? meetingsToday.map(i =>
      '- ' + H.hhmm(i.datetime) + ' 【' + this.projectName(i.projectId) + '】' + i.title + (i.done ? '（已完成）' : '') + (i.note ? '\n  结论/备注：' + i.note : '')).join('\n') : '无') + '\n\n';
    md += '## ⏳ 未完成 / 延期（' + missed.length + '）\n' + (missed.length ? missed.map(i =>
      '- ' + dayStrOf(i.datetime).slice(5).replace('-', '/') + ' 【' + this.projectName(i.projectId) + '】' + i.title).join('\n') : '无') + '\n\n';
    md += '## 📌 明日安排（' + tomorrowItems.length + '）\n' + (tomorrowItems.length ? tomorrowItems.map(i =>
      '- ' + H.hhmm(i.datetime) + ' 【' + this.projectName(i.projectId) + '】' + i.title + (i.note ? '：' + i.note.slice(0, 80) : '')).join('\n') : '无') + '\n\n';
    if (noDate.length) md += '## 📥 无日期待办（' + noDate.length + '）\n' + noDate.map(line).join('\n') + '\n\n';

    const aiInput = '今日完成：' + (doneToday.map(i => i.title).join('；') || '无') +
      '\n未完成/延期：' + (missed.map(i => i.title).join('；') || '无') +
      '\n明日安排：' + (tomorrowItems.map(i => i.title).join('；') || '无');
    const ai = await this._aiSummary(aiInput, '你是干练的个人工作助理。根据给定数据写 100 字以内的中文日报小结：先一句概括今日节奏，再点出最需要注意的一件事。不要列表，直接一段话。');
    md += '## 🤖 AI 小结\n' + (ai || '（未配置 API Key 或生成失败，跳过）');

    const pushContent = '## 📄 日报 ' + (now.getMonth() + 1) + '月' + now.getDate() + '日 ' + H.weekCN + '\n' +
      '> ✅ 完成 ' + doneToday.length + ' · ⏳ 未完成 ' + missed.length + ' · 📌 明日 ' + tomorrowItems.length + '\n' +
      (ai ? ai.slice(0, 300) + '\n' : '') +
      '<font color="comment">完整日报已存入 WorkMemo「报告」菜单</font>';
    return { title: '日报 ' + today, period: today, content: md, pushContent: pushContent };
  },

  // ---- 周报（每周六，默认 09:00；覆盖近 7 天 + 未来 7 天）----
  async _buildWeeklyReport() {
    const now = new Date();
    const end = dateToStr(now);
    const start = dateToStr(new Date(now.getTime() - 6 * 86400000));
    const next7 = dateToStr(new Date(now.getTime() + 7 * 86400000));
    const inRange = (d) => d && dayStrOf(d) >= start && dayStrOf(d) <= end;

    const doneWeek = this.data.workItems.filter(i => i.done && i.doneAt && inRange(i.doneAt));
    const meetingsWeek = this.data.workItems.filter(i => i.type === 'meeting' && inRange(i.datetime || ''));
    const delivsWeek = this.data.workItems.filter(i => i.type === 'deliverable' && inRange(i.datetime || i.createdAt || ''));
    const nextWeek = this.data.workItems.filter(i => i.datetime && dayStrOf(i.datetime) > end && dayStrOf(i.datetime) <= next7)
      .sort((a, b) => a.datetime < b.datetime ? -1 : 1);
    const actives = this.data.projects.filter(p => p.stage !== '暂停');

    let md = '# 周报 · ' + start.slice(5).replace('-', '/') + ' – ' + end.slice(5).replace('-', '/') + '\n\n';
    md += '## 📊 本周数字\n- 完成事项 ' + doneWeek.length + ' 项 · 会议 ' + meetingsWeek.length + ' 场 · 交付物 ' + delivsWeek.length + ' 个\n\n';

    md += '## 📁 活跃项目进展（' + actives.length + ' 个）\n';
    const stagnant = [];
    actives.forEach(p => {
      const items = this.itemsOf(p.id);
      const actions = items.filter(i => (i.doneAt && inRange(i.doneAt)) || inRange(i.datetime || '') || inRange(i.createdAt || ''));
      const todos = items.filter(i => !i.done);
      if (!actions.length && !items.some(i => i.createdAt && dayStrOf(i.createdAt) > start)) stagnant.push(p);
      md += '### ' + p.name + '（' + (p.stage || '未设阶段') + (p.priority ? ' · ' + p.priority : '') + '）\n';
      md += '本周动作：\n' + (actions.length ? actions.map(i => '- ' + (i.done ? '✅ ' : '') + i.title + (i.note ? '：' + i.note.slice(0, 120) : '')).join('\n') : '- 本周无新动作') + '\n';
      md += '当前待办：\n' + (todos.length ? todos.map(i => '- ' + i.title + (i.datetime ? '（' + dayStrOf(i.datetime).slice(5).replace('-', '/') + '）' : '')).join('\n') : '- 无') + '\n';
    });
    md += '\n';

    md += '## 📦 本周交付物（' + delivsWeek.length + '）\n' + (delivsWeek.length ? delivsWeek.map(i =>
      '- 【' + this.projectName(i.projectId) + '】' + i.title + ((i.fileIds && i.fileIds.length) ? '（附件 ' + i.fileIds.length + ' 个）' : '')).join('\n') : '无') + '\n\n';
    md += '## ⚠️ 停滞预警（近 7 天无动静，' + stagnant.length + ' 个）\n' + (stagnant.length ? stagnant.map(p => '- ' + p.name + '（' + (p.stage || '未设阶段') + '）').join('\n') : '无') + '\n\n';
    md += '## 🗓 下周日程（' + nextWeek.length + '）\n' + (nextWeek.length ? nextWeek.map(i =>
      '- ' + dayStrOf(i.datetime).slice(5).replace('-', '/') + ' 【' + this.projectName(i.projectId) + '】' + i.title).join('\n') : '无') + '\n\n';

    const aiInput = '本周完成 ' + doneWeek.length + ' 项：' + (doneWeek.map(i => i.title).join('；') || '无') +
      '\n会议 ' + meetingsWeek.length + ' 场：' + (meetingsWeek.map(i => i.title).join('；') || '无') +
      '\n停滞项目：' + (stagnant.map(p => p.name).join('、') || '无') +
      '\n下周日程：' + (nextWeek.map(i => i.title).join('；') || '无');
    const ai = await this._aiSummary(aiInput, '你是售前团队的工作助理。根据给定数据写 200 字以内的中文周报总结：本周亮点、需要关注的风险、下周建议各一句。直接分段写，不要标题。');
    md += '## 🤖 AI 周总结\n' + (ai || '（未配置 API Key 或生成失败，跳过）');

    const pushContent = '## 📊 周报 ' + start.slice(5).replace('-', '/') + '–' + end.slice(5).replace('-', '/') + '\n' +
      '> 完成 ' + doneWeek.length + ' 项 · 会议 ' + meetingsWeek.length + ' 场 · 交付物 ' + delivsWeek.length + ' 个 · 停滞项目 ' + stagnant.length + ' 个\n' +
      '<font color="comment">完整周报已存入 WorkMemo「报告」菜单</font>';
    return { title: '周报 ' + start + ' ~ ' + end, period: start + '~' + end, content: md, pushContent: pushContent };
  },

  // ---- 月报（每月最后一天，默认 22:00）----
  async _buildMonthlyReport() {
    const now = new Date();
    const monthKey = dateToStr(now).slice(0, 7);
    const inMonth = (d) => d && dayStrOf(d).slice(0, 7) === monthKey;

    const doneMonth = this.data.workItems.filter(i => i.done && i.doneAt && inMonth(i.doneAt));
    const meetingsMonth = this.data.workItems.filter(i => i.type === 'meeting' && inMonth(i.datetime || ''));
    const delivsMonth = this.data.workItems.filter(i => i.type === 'deliverable' && inMonth(i.datetime || i.createdAt || ''));
    const normal = this.data.projects;

    let md = '# 月报 · ' + now.getFullYear() + ' 年 ' + (now.getMonth() + 1) + ' 月\n\n';
    md += '## 📊 月度数字\n- 完成事项 ' + doneMonth.length + ' 项 · 会议 ' + meetingsMonth.length + ' 场 · 交付物 ' + delivsMonth.length + ' 个 · 在管项目 ' + normal.length + ' 个\n\n';

    md += '## 🔀 项目阶段漏斗（当前）\n';
    STAGES.forEach(s => {
      const ps = normal.filter(p => p.stage === s);
      if (ps.length) md += '- ' + s + '（' + ps.length + '）：' + ps.map(p => p.name).join('、') + '\n';
    });
    const noStage = normal.filter(p => !p.stage);
    if (noStage.length) md += '- 未设阶段（' + noStage.length + '）：' + noStage.map(p => p.name).join('、') + '\n';
    md += '\n';

    const key = normal.filter(p => (p.priority === 'P0' || p.priority === 'P1') && p.stage !== '暂停');
    md += '## 🎯 重点项目详述（P0/P1，' + key.length + ' 个）\n';
    if (!key.length) md += '（暂无 P0/P1 项目，可在项目卡片上设置优先级）\n';
    key.forEach(p => {
      const items = this.itemsOf(p.id);
      const actions = items.filter(i => (i.doneAt && inMonth(i.doneAt)) || inMonth(i.datetime || '') || inMonth(i.createdAt || ''));
      const todos = items.filter(i => !i.done);
      md += '### ' + p.name + '（' + (p.stage || '未设阶段') + ' · ' + p.priority + '）\n';
      md += '本月动作：\n' + (actions.length ? actions.map(i => '- ' + (i.done ? '✅ ' : '') + i.title + (i.note ? '：' + i.note.slice(0, 120) : '')).join('\n') : '- 本月无新动作') + '\n';
      md += '当前待办：\n' + (todos.length ? todos.map(i => '- ' + i.title).join('\n') : '- 无') + '\n';
    });
    md += '\n';

    md += '## 📦 本月交付物（' + delivsMonth.length + '）\n' + (delivsMonth.length ? delivsMonth.map(i =>
      '- 【' + this.projectName(i.projectId) + '】' + i.title + ((i.fileIds && i.fileIds.length) ? '（附件 ' + i.fileIds.length + ' 个）' : '')).join('\n') : '无') + '\n\n';

    const stagnant = normal.filter(p => p.stage !== '暂停' && !this.itemsOf(p.id).some(i =>
      (i.doneAt && inMonth(i.doneAt)) || inMonth(i.datetime || '') || inMonth(i.createdAt || '')));
    md += '## ⚠️ 全月无动静项目（' + stagnant.length + ' 个）\n' + (stagnant.length ? stagnant.map(p => '- ' + p.name + '（' + (p.stage || '未设阶段') + '）').join('\n') : '无') + '\n\n';

    const aiInput = '月份：' + monthKey + '\n完成 ' + doneMonth.length + ' 项，会议 ' + meetingsMonth.length + ' 场，交付物 ' + delivsMonth.length + ' 个' +
      '\n阶段分布：' + STAGES.map(s => s + ' ' + normal.filter(p => p.stage === s).length).filter(x => !x.endsWith(' 0')).join('，') +
      '\n全月无动静：' + (stagnant.map(p => p.name).join('、') || '无');
    const ai = await this._aiSummary(aiInput, '你是售前团队负责人的助理。根据给定数据写 300 字以内的中文月度复盘：本月成果两句、问题与风险一句、下月重点建议两句。直接分段写，不要标题。');
    md += '## 🤖 AI 月度复盘\n' + (ai || '（未配置 API Key 或生成失败，跳过）');

    const pushContent = '## 📈 月报 ' + monthKey + '\n' +
      '> 完成 ' + doneMonth.length + ' 项 · 会议 ' + meetingsMonth.length + ' 场 · 交付物 ' + delivsMonth.length + ' 个\n' +
      '<font color="comment">完整月报已存入 WorkMemo「报告」菜单</font>';
    return { title: '月报 ' + monthKey, period: monthKey, content: md, pushContent: pushContent };
  },

  // ---- 报告页面 ----
  async renderReports() {
    const reports = (await db.getAll('reports').catch(() => [])).sort((a, b) => a.createdAt < b.createdAt ? 1 : -1);
    const filter = this._reportFilter || '';
    const typeMeta = {
      daily: { label: '日报', icon: 'fa-sun', cls: 'bg-amber-50 text-amber-600' },
      weekly: { label: '周报', icon: 'fa-calendar-week', cls: 'bg-indigo-50 text-indigo-600' },
      monthly: { label: '月报', icon: 'fa-calendar', cls: 'bg-emerald-50 text-emerald-600' },
    };
    const visible = filter ? reports.filter(r => r.type === filter) : reports;

    let html = '<div class="fade-in max-w-4xl mx-auto">';
    html += '<div class="flex items-center justify-between mb-4 flex-wrap gap-2">';
    html += '<div><h2 class="text-lg font-bold text-slate-800">报告</h2><p class="text-xs text-slate-400 mt-0.5">日报每天 20:00 · 周报每周六 09:00 · 月报每月最后一天 22:00 自动生成（时间可在设置里调整）</p></div>';
    html += '<div class="flex gap-2">';
    html += '<button onclick="app.generateReport(\'daily\')" class="btn-ghost px-3 py-2 rounded-lg text-xs border border-slate-200 bg-white">立即生成日报</button>';
    html += '<button onclick="app.generateReport(\'weekly\')" class="btn-ghost px-3 py-2 rounded-lg text-xs border border-slate-200 bg-white">立即生成周报</button>';
    html += '<button onclick="app.generateReport(\'monthly\')" class="btn-ghost px-3 py-2 rounded-lg text-xs border border-slate-200 bg-white">立即生成月报</button>';
    html += '</div></div>';

    html += '<div class="flex gap-1.5 mb-4">';
    [['', '全部'], ['daily', '日报'], ['weekly', '周报'], ['monthly', '月报']].forEach(([v, l]) => {
      html += '<button onclick="app.setReportFilter(\'' + v + '\')" class="px-3 py-1.5 rounded-lg text-xs ' + (filter === v ? 'bg-indigo-600 text-white font-medium' : 'bg-white border border-slate-200 text-slate-600') + '">' + l + '</button>';
    });
    html += '</div>';

    if (!visible.length) {
      html += '<div class="card empty-state py-16"><i class="fa-solid fa-file-lines text-3xl mb-3 text-slate-300"></i><p class="text-sm">' + (reports.length ? '该类型暂无报告' : '还没有报告。点右上角「立即生成」试试，或等到定时自动生成') + '</p></div>';
    } else {
      html += '<div class="space-y-2">';
      visible.forEach(r => {
        const m = typeMeta[r.type] || typeMeta.daily;
        html += '<div class="card p-4 flex items-center gap-3 cursor-pointer hover:border-indigo-200 transition-colors" onclick="app.viewReport(' + r.id + ')">';
        html += '<span class="tag ' + m.cls + ' text-[11px]"><i class="fa-solid ' + m.icon + ' mr-1"></i>' + m.label + '</span>';
        html += '<div class="flex-1 min-w-0"><div class="text-sm font-medium text-slate-700 truncate">' + escapeHtml(r.title) + '</div>';
        html += '<div class="text-[11px] text-slate-400 mt-0.5">生成于 ' + fmtDateTime(r.createdAt) + '</div></div>';
        html += '<button onclick="event.stopPropagation();app.deleteReport(' + r.id + ')" class="text-slate-300 hover:text-red-500 px-2" title="删除"><i class="fa-solid fa-trash-can text-xs"></i></button>';
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
    $('#contentArea').innerHTML = html;
  },

  setReportFilter(v) { this._reportFilter = v; this.renderReports(); },

  async viewReport(id) {
    const r = await db.get('reports', id);
    if (!r) { showToast('报告不存在', 'error'); return; }
    let html = '<div class="fade-in max-w-4xl mx-auto">';
    html += '<div class="flex items-center gap-3 mb-4">';
    html += '<button onclick="app.renderReports()" class="btn-ghost px-3 py-2 rounded-lg text-sm border border-slate-200 bg-white"><i class="fa-solid fa-arrow-left mr-1"></i>返回列表</button>';
    html += '<div class="flex-1"><h2 class="text-lg font-bold text-slate-800">' + escapeHtml(r.title) + '</h2><p class="text-xs text-slate-400">生成于 ' + fmtDateTime(r.createdAt) + '</p></div>';
    html += '</div>';
    html += '<div class="card p-6">' + this._mdToHtml(r.content) + '</div>';
    html += '</div>';
    $('#contentArea').innerHTML = html;
    $('#contentArea').scrollTop = 0;
  },

  async deleteReport(id) {
    if (!await this.confirmModal({ title: '删除报告', message: '确定删除这份报告？', danger: true })) return;
    await db.delete('reports', id);
    showToast('报告已删除');
    this.renderReports();
  },

  _mdToHtml(md) {
    const lines = String(md || '').split('\n');
    let html = '';
    for (let ln of lines) {
      ln = escapeHtml(ln);
      if (!ln.trim()) { html += '<div class="h-2"></div>'; continue; }
      ln = ln.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      if (ln.startsWith('### ')) html += '<div class="font-semibold text-slate-700 text-sm mt-3">' + ln.slice(4) + '</div>';
      else if (ln.startsWith('## ')) html += '<div class="font-bold text-slate-800 mt-4 mb-1 pb-1 border-b border-slate-100">' + ln.slice(3) + '</div>';
      else if (ln.startsWith('# ')) html += '<div class="text-lg font-bold text-slate-800 mb-2">' + ln.slice(2) + '</div>';
      else if (ln.startsWith('- ')) html += '<div class="pl-3 py-0.5 text-sm text-slate-700 flex gap-1.5"><span class="text-slate-300 flex-shrink-0">·</span><span class="flex-1">' + ln.slice(2) + '</span></div>';
      else html += '<div class="text-sm text-slate-600 py-0.5">' + ln + '</div>';
    }
    return html;
  },

  // ===================== 商机线索（FDE 在线表格本地镜像，上传覆盖更新） =====================
  async renderLeads() {
    const rec = await db.get('leadSheets', 'latest').catch(() => null);
    let html = '<div class="fade-in max-w-6xl mx-auto">';
    html += '<div class="flex items-center justify-between mb-4 flex-wrap gap-2">';
    html += '<div><h2 class="text-lg font-bold text-slate-800">商机线索</h2><p class="text-xs text-slate-400 mt-0.5">FDE 实施部在线表格的本地镜像：从企业微信导出 xlsx 后上传，覆盖更新全部内容</p></div>';
    html += '<div class="flex gap-2">';
    if (rec) html += '<button onclick="app.syncLeadsToProjects()" class="btn-ghost px-4 py-2 rounded-lg text-sm border border-indigo-200 text-indigo-600 bg-indigo-50/50" title="把各项目进度页的增量内容同步到项目泳道"><i class="fa-solid fa-rotate mr-1"></i>同步到项目</button>';
    html += '<label class="btn-primary px-4 py-2 rounded-lg text-sm cursor-pointer"><i class="fa-solid fa-upload mr-1"></i>' + (rec ? '更新表格' : '上传表格') + '<input type="file" class="hidden" accept=".xlsx,.xls" onchange="app.importLeadsXlsx(this)"></label>';
    html += '</div></div>';

    if (!rec) {
      html += '<div class="card empty-state py-16"><i class="fa-solid fa-table-list text-3xl mb-3 text-slate-300"></i>';
      html += '<p class="text-sm mb-1">还没有上传过表格</p>';
      html += '<p class="text-xs text-slate-400">企业微信在线表格 → 右上角导出为 xlsx → 点右上角「上传表格」</p></div>';
    } else {
      html += '<div class="text-xs text-slate-400 mb-3"><i class="fa-solid fa-file-excel text-emerald-500 mr-1"></i>' + escapeHtml(rec.fileName) + ' · 更新于 ' + fmtDateTime(rec.uploadedAt) + ' · 共 ' + rec.sheets.length + ' 个分页</div>';
      const active = (this._leadSheet && rec.sheets.some(s => s.name === this._leadSheet)) ? this._leadSheet : rec.sheets[0].name;
      this._leadSheet = active;
      html += '<div class="flex gap-1.5 flex-wrap mb-3">';
      rec.sheets.forEach(s => {
        html += '<button onclick="app.setLeadSheet(\'' + String(s.name).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + '\')" class="px-3 py-1.5 rounded-lg text-xs ' + (s.name === active ? 'bg-indigo-600 text-white font-medium' : 'bg-white border border-slate-200 text-slate-600 hover:border-indigo-300') + '">' + escapeHtml(s.name) + '</button>';
      });
      html += '</div>';
      html += this._renderLeadTable(rec.sheets.find(s => s.name === active));
    }
    html += '</div>';
    $('#contentArea').innerHTML = html;
  },

  setLeadSheet(name) { this._leadSheet = name; this.renderLeads(); },

  _renderLeadTable(sheet) {
    const rows = (sheet && sheet.rows) || [];
    if (!rows.length) return '<div class="card p-8 text-center text-sm text-slate-400">这个分页是空的</div>';
    let maxCol = 0;
    rows.forEach(r => {
      for (let c = r.length - 1; c >= 0; c--) {
        if (String(r[c] == null ? '' : r[c]).trim()) { if (c + 1 > maxCol) maxCol = c + 1; break; }
      }
    });
    if (!maxCol) return '<div class="card p-8 text-center text-sm text-slate-400">这个分页是空的</div>';
    let html = '<div class="card p-0 overflow-x-auto"><table class="text-xs w-full" style="border-collapse:collapse;min-width:640px">';
    rows.forEach(r => {
      const cells = [];
      for (let c = 0; c < maxCol; c++) cells.push(String(r[c] == null ? '' : r[c]));
      const nonEmpty = cells.filter(x => x.trim());
      if (!nonEmpty.length) return;
      if (nonEmpty.length === 1) {
        html += '<tr><td colspan="' + maxCol + '" class="px-3 py-2 font-semibold text-slate-700 bg-slate-50 border-b border-slate-100">' + escapeHtml(nonEmpty[0]) + '</td></tr>';
      } else {
        html += '<tr>';
        cells.forEach(v => {
          html += '<td class="px-3 py-1.5 border-b border-slate-50 text-slate-600 align-top" style="max-width:260px"><div class="whitespace-pre-line break-words">' + escapeHtml(v) + '</div></td>';
        });
        html += '</tr>';
      }
    });
    html += '</table></div>';
    return html;
  },

  async importLeadsXlsx(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    if (typeof XLSX === 'undefined') { showToast('表格解析组件未加载（需要联网加载一次 CDN），请检查网络后刷新页面重试', 'error'); return; }
    try {
      showToast('正在解析 ' + file.name + ' …', 'info');
      const old = await db.get('leadSheets', 'latest').catch(() => null);
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const sheets = wb.SheetNames.map(name => {
        let rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: false, defval: '' });
        rows = rows.map(r => r.map(v => String(v == null ? '' : v)));
        while (rows.length && !rows[rows.length - 1].some(v => v.trim())) rows.pop();  // 去尾部空行
        // 去尾部空列（企微导出常带几十个幽灵样式空列）
        let maxCol = 0;
        rows.forEach(r => { for (let c = r.length - 1; c >= 0; c--) { if (String(r[c]).trim()) { if (c + 1 > maxCol) maxCol = c + 1; break; } } });
        rows = rows.map(r => r.slice(0, maxCol));
        return { name: name, rows: rows };
      });
      await db.put('leadSheets', { key: 'latest', fileName: file.name, uploadedAt: new Date().toISOString(), sheets: sheets });
      this._leadSheet = null;
      if (this.page === 'leads') this.renderLeads();

      // 解析诊断：分页差异对比 + 每页行数，让新增/缺失分页一眼可见
      const oldNames = old ? old.sheets.map(s => s.name) : [];
      const newNames = sheets.map(s => s.name);
      const added = newNames.filter(n => !oldNames.includes(n));
      const removed = oldNames.filter(n => !newNames.includes(n));
      let html = '<h3 class="text-lg font-bold text-slate-800 mb-1">解析完成</h3>';
      html += '<p class="text-xs text-slate-400 mb-3">' + escapeHtml(file.name) + ' · 共 ' + sheets.length + ' 个分页</p>';
      if (old) {
        html += '<div class="text-xs mb-3 space-y-1">';
        if (added.length) html += '<p class="text-emerald-600"><i class="fa-solid fa-circle-plus mr-1"></i>新增分页：' + added.map(escapeHtml).join('、') + '</p>';
        if (removed.length) html += '<p class="text-amber-600"><i class="fa-solid fa-circle-minus mr-1"></i>比上次少了：' + removed.map(escapeHtml).join('、') + '</p>';
        if (!added.length && !removed.length) html += '<p class="text-slate-400">分页结构与上次一致</p>';
        html += '</div>';
      }
      html += '<div class="space-y-1 max-h-64 overflow-y-auto w-96 max-w-full">';
      sheets.forEach(s => {
        html += '<div class="flex items-center gap-2 text-xs p-1.5 rounded bg-slate-50"><span class="flex-1 truncate text-slate-700">' + escapeHtml(s.name) + '</span><span class="text-slate-400">' + s.rows.length + ' 行</span></div>';
      });
      html += '</div>';
      html += '<div class="flex gap-2 pt-3">';
      html += '<button id="leadImportSyncBtn" class="btn-primary flex-1 py-2 rounded-lg text-sm">同步到项目泳道</button>';
      html += '<button onclick="closeModal()" class="btn-ghost flex-1 py-2 rounded-lg text-sm">关闭</button></div>';
      openModal(html);
      $('#leadImportSyncBtn').onclick = async () => { closeModal(); await this.syncLeadsToProjects(); };
    } catch (e) {
      console.error(e);
      showToast('解析失败：' + (e.message || '文件格式不支持'), 'error');
    } finally {
      input.value = '';
    }
  },

  // ---- 把商机线索里各项目进度页的增量同步到项目泳道 ----
  async syncLeadsToProjects() {
    const rec = await db.get('leadSheets', 'latest').catch(() => null);
    if (!rec || !rec.sheets) { showToast('还没有上传过商机线索表格', 'warning'); return; }
    await this.refreshData();

    const parseDate = (s) => {
      const m = /^(\d{1,2})月(\d{1,2})日/.exec(String(s || '').trim());
      if (!m) return null;
      const y = new Date().getFullYear();
      return y + '-' + String(m[1]).padStart(2, '0') + '-' + String(m[2]).padStart(2, '0');
    };
    const isBlankSummary = (txt) => !txt || txt.replace(/\s/g, '') === '本周：下周：待讨论：';
    const uploadDate = (rec.uploadedAt || '').slice(0, 10);

    // 识别"项目进度页"：首行含「进度」二字
    const projSheets = rec.sheets.filter(s => s.rows[0] && s.rows[0].some(c => String(c).includes('进度')));
    if (!projSheets.length) { showToast('表格里没有识别到项目进度页（首行需含"进度"）', 'warning'); return; }

    const projByName = {};
    this.data.projects.forEach(p => { projByName[p.name] = p; });

    const result = [];
    for (const sheet of projSheets) {
      const name = sheet.name;
      // 缺失项目自动创建（阶段留空，由用户设定）
      if (!projByName[name]) {
        const id = await db.add('projects', { name: name, stage: '', special: false, priority: '' });
        await this.refreshData();
        projByName[name] = this.data.projects.find(p => p.id === id);
        result.push({ name, created: true, added: 0, skipped: 0 });
      }
      const proj = projByName[name];
      const existing = this.itemsOf(proj.id);
      const res = result.find(r => r.name === name) || { name, created: false, added: 0, skipped: 0 };
      if (!result.includes(res)) result.push(res);

      // 全表最大日期（用于周总结日期兜底）
      let maxDate = '';
      sheet.rows.forEach(r => r.slice(0, 2).forEach(c => { const d = parseDate(c); if (d && d > maxDate) maxDate = d; }));

      const rows = sheet.rows;
      for (let idx = 0; idx < rows.length; idx++) {
        const cells = rows[idx].map(v => String(v == null ? '' : v).trim()).concat(['', '', '', '', '', '']);
        let dateStr = null, title = '', note = '', tags = ['进展'];
        if (cells[0] === '周总结') {
          const txt = cells[2];
          if (isBlankSummary(txt)) continue;
          title = '周总结'; note = txt; tags = ['周总结'];
          if (cells[3] && cells[3] !== '/') note += '\n交付物：' + cells[3];
          if (cells[4] && cells[4] !== '/') note += '\n备注：' + cells[4];
          // 日期取下方最近的日期行；若离上传日超过 21 天则用上传日（当前周总结）
          for (let j = idx + 1; j < rows.length; j++) {
            for (const c of rows[j].slice(0, 2)) { const d = parseDate(c); if (d) { dateStr = d; break; } }
            if (dateStr) break;
          }
          if (!dateStr || (uploadDate && dateStr < uploadDate && (new Date(uploadDate) - new Date(dateStr)) > 21 * 86400000)) dateStr = uploadDate || maxDate;
          if (!dateStr) continue;
        } else if (cells[0] === '过往情况') {
          dateStr = parseDate(cells[1]);
          if (!dateStr) continue;
          title = (cells[1] + ' ' + cells[2]).trim();
          note = '时间：' + cells[1] + '\n内容：' + cells[2];
          if (cells[3] && cells[3] !== '/') note += '\n交付物：' + cells[3];
        } else {
          for (const ci of [0, 1]) {
            const d = parseDate(cells[ci]);
            if (!d) continue;
            const content = cells[ci + 1];
            if (!content || content === '-') break;
            dateStr = d;
            title = content.split('\n')[0].slice(0, 40);
            note = content;
            if (cells[ci + 2] && !['/', '-'].includes(cells[ci + 2])) note += '\n交付物：' + cells[ci + 2];
            if (cells[ci + 3] && !['/', '-'].includes(cells[ci + 3])) note += '\n备注：' + cells[ci + 3];
            break;
          }
          if (!dateStr || !title) continue;
        }
        // 去重：同项目 + 同日期 + 内容前 10 字已存在
        const sig = note.slice(0, 10);
        const dup = existing.some(x => x.datetime && x.datetime.slice(0, 10) === dateStr && sig && ((x.note || '') + (x.title || '')).includes(sig));
        if (dup) { res.skipped++; continue; }
        await db.add('workItems', {
          projectId: proj.id, type: 'task', title: title,
          datetime: dateStr + 'T09:00', done: true, doneAt: dateStr + 'T18:00',
          note: note, tags: tags
        });
        res.added++;
        existing.push({ datetime: dateStr + 'T09:00', note, title });
      }
    }
    await this.refreshData();

    // 结果汇总
    let html = '<h3 class="text-lg font-bold text-slate-800 mb-4">同步完成</h3>';
    html += '<div class="space-y-2 w-96 max-w-full max-h-96 overflow-y-auto">';
    result.forEach(r => {
      html += '<div class="flex items-center gap-2 text-sm p-2 rounded-lg bg-slate-50">';
      html += '<span class="font-medium text-slate-700 flex-1 truncate">' + escapeHtml(r.name) + '</span>';
      if (r.created) html += '<span class="tag bg-emerald-50 text-emerald-600 text-[10px]">新建项目</span>';
      html += '<span class="text-xs text-slate-500">新增 ' + r.added + ' 条' + (r.skipped ? ' · 跳过重复 ' + r.skipped : '') + '</span>';
      html += '</div>';
    });
    html += '</div><div class="flex gap-2 pt-3"><button onclick="closeModal();app.navigate(\'projects\')" class="btn-primary flex-1 py-2 rounded-lg text-sm">去项目泳道查看</button><button onclick="closeModal()" class="btn-ghost flex-1 py-2 rounded-lg text-sm">关闭</button></div>';
    openModal(html);
  },

  stopReminderLoop() {
    if (this._reminderTimer) { clearInterval(this._reminderTimer); this._reminderTimer = null; }
  },

  async toggleReminders(enabled) {
    if (enabled) {
      const granted = await this.ensureNotificationPermission();
      if (granted) {
        await db.setSetting('remindersEnabled', true);
        this.startReminderLoop();
        showToast('提醒已开启', 'success');
      } else {
        const cb = $('#settingRemindersEnabled');
        if (cb) cb.checked = false;
        showToast('未获得通知权限，提醒未开启', 'warning');
      }
    } else {
      await db.setSetting('remindersEnabled', false);
      this.stopReminderLoop();
      showToast('提醒已关闭', 'info');
    }
  },

  async setupReminders() {
    if (!('Notification' in window)) return;
    if (Notification.permission !== 'granted') return;
    const now = Date.now();
    const items = await db.getAll('workItems');
    for (const s of items) {
      if (s.done || !s.reminderMinutes || !s.datetime) continue;
      const schTime = new Date(s.datetime).getTime();
      const remindTime = schTime - s.reminderMinutes * 60000;
      const remindEnd = remindTime + 60000;
      if (s.lastRemindedAt && new Date(s.lastRemindedAt).getTime() >= remindTime) continue;
      if (remindTime <= now && now < remindEnd) {
        new Notification('WorkMemo 提醒', { body: s.title });
        s.lastRemindedAt = new Date().toISOString();
        await db.put('workItems', s);
      }
    }
    // 兼容旧版 schedules
    const schedules = await db.getAll('schedules');
    for (const s of schedules) {
      if (s.status !== 'pending' || !s.reminderMinutes) continue;
      const schTime = new Date(s.datetime).getTime();
      const remindTime = schTime - s.reminderMinutes * 60000;
      const remindEnd = remindTime + 60000;
      if (s.lastRemindedAt && new Date(s.lastRemindedAt).getTime() >= remindTime) continue;
      if (remindTime <= now && now < remindEnd) {
        new Notification('WorkMemo 提醒', { body: s.title });
        s.lastRemindedAt = new Date().toISOString();
        await db.put('schedules', s);
      }
    }
  },

  // ===================== VERSION COMPRESSION =====================
  async compressVersions() {
    const all = await db.getAll('versions');
    const groups = {};
    for (const v of all) {
      const key = v.entityType + ':' + v.entityId;
      (groups[key] = groups[key] || []).push(v);
    }
    for (const key in groups) {
      const list = groups[key].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
      if (list.length <= 30) continue;
      const keep = new Set();
      for (let i = 0; i < 5; i++) { keep.add(list[i].id); keep.add(list[list.length - 1 - i].id); }
      for (let i = 10; i < list.length - 10; i += 5) keep.add(list[i].id);
      for (const v of list) if (v.action === 'delete' || v.action === 'restore') keep.add(v.id);
      for (const v of list) if (!keep.has(v.id)) await db.delete('versions', v.id);
    }
  },

  async restoreVersion(entityType, entityId, versionId) {
    if (!await this.confirmModal({ title: '恢复版本', message: '当前内容将被覆盖，确定恢复？' })) return;
    const STORE_MAP = { dailyPlan: 'dailyPlans', workLog: 'workLogs', schedule: 'schedules', memo: 'memos', workItem: 'workItems', project: 'projects' };
    const storeName = STORE_MAP[entityType];
    if (!storeName) { showToast('未知版本类型: ' + entityType, 'error'); return; }
    const versions = await db.getVersions(entityType, entityId);
    const version = versions.find(v => v.id === versionId);
    if (!version) return;
    const current = await db.get(storeName, entityId);
    if (current) await db.saveVersion(entityType, entityId, current, 'edit');
    await db.put(storeName, Object.assign({}, version.data, { id: entityId, updatedAt: new Date().toISOString() }));
    showToast('已恢复到选定版本', 'success');
    closeModal();
    await this.refreshData();
    if (entityType === 'memo') this.renderMemo();
    else this._refreshCurrentView();
  },

  // ===================== CONFIRM MODAL =====================
  confirmModal(opts) {
    return new Promise((resolve) => {
      this._confirmResolver = resolve;
      let html = '<div class="w-96 max-w-full">';
      html += '<h3 class="text-lg font-bold text-slate-800 mb-2">' + escapeHtml(opts.title || '确认') + '</h3>';
      html += '<p class="text-sm text-slate-500 mb-4 whitespace-pre-line">' + escapeHtml(opts.message || '') + '</p>';
      if (opts.requireInput) {
        html += '<input type="text" id="confirmInput" class="input-field text-sm mb-4" placeholder="请输入 ' + escapeHtml(opts.requireInput) + '">';
      }
      html += '<div class="flex gap-2">';
      html += '<button onclick="app._resolveConfirm(true, ' + (opts.requireInput ? "'" + opts.requireInput + "'" : 'null') + ')" class="btn-primary flex-1 py-2 rounded-lg text-sm ' + (opts.danger ? '" style="background:linear-gradient(135deg,#ef4444,#dc2626)"' : '') + '">确定</button>';
      html += '<button onclick="app._resolveConfirm(false)" class="btn-ghost flex-1 py-2 rounded-lg text-sm">取消</button>';
      html += '</div></div>';
      openModal(html);
    });
  },

  _resolveConfirm(result, requireInput) {
    if (result && requireInput) {
      const input = document.getElementById('confirmInput');
      if (input && input.value.trim() !== requireInput) {
        input.style.borderColor = '#ef4444';
        input.setAttribute('placeholder', '输入不匹配，请重新输入 ' + requireInput);
        return;
      }
    }
    if (this._confirmResolver) { this._confirmResolver(result); this._confirmResolver = null; }
    closeModal();
  },
};

// 公网/共享链接的轻量访问确认（真正的公网安全仍应在反向代理层配置 Basic Auth/Access）
const WORKMEMO_ACCESS_CODE = 'workmemo';
async function unlockWorkMemo() {
  const input = document.getElementById('accessCode');
  const error = document.getElementById('accessError');
  if (!input || input.value !== WORKMEMO_ACCESS_CODE) {
    if (error) error.textContent = '访问代码不正确';
    if (input) { input.value = ''; input.focus(); }
    return;
  }
  // Node 公网部署会在服务端签发 HttpOnly 会话；GitHub Pages 等静态托管没有此接口时继续使用本地确认。
  if (/^https?:$/.test(location.protocol)) {
    try {
      const resp = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: input.value }) });
      if (resp.status !== 404 && resp.status !== 405 && !resp.ok) {
        if (error) error.textContent = '服务端未接受访问代码';
        return;
      }
    } catch (_) { /* 静态托管无 API 时退回本地确认 */ }
  }
  try { localStorage.setItem('wm_access_granted', '1'); } catch (_) {}
  const gate = document.getElementById('accessGate');
  if (gate) gate.remove();
  await app.init();
}

// Init：Node 服务端会话失效时重新要求代码；静态托管按本机确认状态进入。
async function bootWorkMemo() {
  let accessGranted = false;
  try { accessGranted = localStorage.getItem('wm_access_granted') === '1'; } catch (_) {}
  if (accessGranted && /^https?:$/.test(location.protocol)) {
    try {
      const resp = await fetch('/api/auth/status', { cache: 'no-store' });
      if (resp.ok) {
        const state = await resp.json();
        if (state && state.authenticated === false) accessGranted = false;
      }
    } catch (_) { /* 静态托管没有鉴权 API */ }
  }
  if (accessGranted) {
    const gate = document.getElementById('accessGate');
    if (gate) gate.remove();
    app.init();
  } else {
    setTimeout(() => { const input = document.getElementById('accessCode'); if (input) input.focus(); }, 0);
  }
}
bootWorkMemo();
</script>
