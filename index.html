  doSearch(query) {
    clearTimeout(this._searchTimer);
    const q = query;
    this._searchTimer = setTimeout(() => this._doSearch(q), 200);
  },

  async _doSearch(query) {
    const container = $('#searchResults');
    if (!query.trim()) { container.innerHTML = ''; return; }
    const q = query.toLowerCase();
    const results = [];

    this.data.projects.forEach(p => {
      if (p.name.toLowerCase().includes(q)) results.push({ type: 'project', title: p.name, id: p.id, stage: p.stage });
    });
    this.data.workItems.filter(i => !i.historyOnly).forEach(i => {
      const hay = (i.title + ' ' + (i.note || '') + ' ' + (i.tags || []).join(' ')).toLowerCase();
      if (hay.includes(q)) results.push({ type: i.type, title: i.title, id: i.id, datetime: i.datetime, done: i.done, project: this.projectName(i.projectId) });
    });
    this.data.memos.forEach(m => {
      if ((m.title || '').toLowerCase().includes(q) || (m.content || '').toLowerCase().includes(q))
        results.push({ type: 'memo', title: m.title, content: m.content, id: m.id });
    });

    const highlight = (text) => escapeHtml(text || '').replace(new RegExp(escapeRegExp(escapeHtml(q)), 'gi'), m => '<span class="search-highlight">' + m + '</span>');
    const icons = { task: 'fa-list-check text-blue-500', meeting: 'fa-users text-purple-500', deliverable: 'fa-file-arrow-up text-orange-500', memo: 'fa-note-sticky text-amber-500', project: 'fa-diagram-project text-indigo-500' };
    const labels = { task: '事项', meeting: '会议', deliverable: '交付物', memo: '备忘', project: '项目' };

    if (results.length) {
      container.innerHTML = results.map(r => {
        let h = '<div class="card p-4 flex items-start gap-3 cursor-pointer hover:bg-slate-50" onclick="app.handleSearchClick(\'' + r.type + '\', ' + (r.id || 'null') + ')">';
        h += '<div class="w-9 h-9 rounded-lg bg-slate-100 flex items-center justify-center flex-shrink-0"><i class="fa-solid ' + icons[r.type] + '"></i></div>';
        h += '<div class="flex-1 min-w-0">';
        h += '<div class="flex items-center gap-2 mb-1 flex-wrap">';
        h += '<span class="tag bg-slate-100 text-slate-500 text-[10px]">' + labels[r.type] + '</span>';
        if (r.project) h += '<span class="tag bg-indigo-50 text-indigo-500 text-[10px]">' + escapeHtml(r.project) + '</span>';
        if (r.stage) h += '<span class="tag ' + (STAGE_COLORS[r.stage] || 'bg-slate-100 text-slate-500') + ' text-[10px]">' + escapeHtml(r.stage) + '</span>';
        if (r.done) h += '<span class="done-label"><i class="fa-solid fa-check"></i>已完成</span>';
        if (r.datetime) h += '<span class="text-xs text-slate-400">' + fmtDateTime(r.datetime) + '</span>';
        h += '</div>';
        h += '<p class="text-sm ' + (r.done ? 'done-text' : 'text-slate-700') + '">' + highlight(r.title || r.content) + '</p>';
        h += '</div></div>';
        return h;
      }).join('');
    } else {
      container.innerHTML = '<div class="empty-state py-12"><p class="text-sm">未找到 "' + escapeHtml(query) + '" 的相关结果</p></div>';
    }
  },

  handleSearchClick(type, id) {
    closeModal();
    if (type === 'memo' && id) { this.navigate('memo'); setTimeout(() => this.renderMemoEditor(id), 50); }
    else if (type === 'project') this.navigate('projects');
    else if (id) this.showItemEdit(id);
  },

  // ===================== AI 助手 =====================
  renderAI() {
    let html = '<div class="fade-in max-w-3xl mx-auto space-y-6">';

  },

  async processAI() {
    const input = $('#aiInput').value.trim();
    if (!input) return;
    const resultDiv = $('#aiResult');
    resultDiv.innerHTML = '<div class="card p-4"><div class="flex items-center gap-2 text-sm text-slate-500"><div class="ai-loading"></div> AI 分析中...</div></div>';
    try {
      const apiKey = await db.getSetting('apiKey', '');
      let parsed = [];
      if (apiKey) {
        const prompt = '用户输入：' + input + '\n\n请解析为结构化事项。如果包含多个任务请拆分为多个item。';
        const response = await callAI([{ role: 'user', content: prompt }], null, AI_SYSTEM_PROMPT_PARSE);
        try {
          const start = response.indexOf('{');
          const end = response.lastIndexOf('}');
          const json = JSON.parse(start !== -1 && end > start ? response.substring(start, end + 1) : response);
          if (json.items) parsed = json.items;
        } catch (e) { parsed = this.mockAIParse(input); }
      } else {
        await new Promise(r => setTimeout(r, 600));
        parsed = this.mockAIParse(input);
      }
      this.renderAIResult(parsed, input);
    } catch (e) {
      resultDiv.innerHTML = '<div class="card p-4 text-sm text-red-500">AI 分析失败: ' + escapeHtml(e.message) + '</div>';
    }
  },

  renderAIResult(parsed, originalInput) {
    const resultDiv = $('#aiResult');
    const typeLabels = { task: '事项', meeting: '会议', deliverable: '交付物', memo: '备忘' };
    let html = '<div class="card p-5 fade-in"><h3 class="font-semibold text-slate-800 mb-3">识别结果</h3><div class="space-y-2">';
    parsed.forEach((item, i) => {
      html += '<div class="flex items-center gap-3 p-3 rounded-lg bg-slate-50">';
      html += '<div class="flex-1">';
      html += '<span class="tag bg-indigo-50 text-indigo-600 text-[10px] mr-2">' + (typeLabels[item.type] || item.type) + '</span>';
      html += '<span class="text-sm text-slate-700">' + escapeHtml(item.text || originalInput.slice(0, 40)) + '</span>';
      if (item.datetime) html += '<span class="text-xs text-slate-400 ml-2">' + item.datetime + '</span>';
      html += '</div></div>';
    });
    html += '</div><button onclick="app.applyAIResult()" class="btn-primary w-full mt-4 py-2 rounded-lg text-sm">确认填入</button></div>';
    resultDiv.innerHTML = html;
    app._aiParsed = parsed;
  },

  mockAIParse(input) {
    const results = [];
    if (/会议|开会|拜访|沟通会/.test(input)) {
      const local = parseScheduleLocal(input);
      results.push({ type: 'meeting', text: local.title, datetime: local.datetime, reminderMinutes: local.reminderMinutes });
    } else if (/交付|提交|方案|报告/.test(input)) {
      const local = parseScheduleLocal(input);
      results.push({ type: 'deliverable', text: local.title, datetime: local.datetime });
    } else if (/明天|下周|需要|要完成|待办/.test(input)) {
      results.push({ type: 'task', text: input.slice(0, 50) });
    } else {
      results.push({ type: 'memo', text: input });
    }
    return results;
  },

  async applyAIResult() {
    if (!app._aiParsed) return;
    const defaultProj = this.specialProjectId('事务性工作');
    for (const item of app._aiParsed) {
      if (!item.type) continue;
      if (item.type === 'memo') {
        await db.add('memos', { title: (item.text || '').slice(0, 20) || 'AI备忘', content: item.text || '', tags: ['AI'], pinned: false });
      } else {
        const type = ['task', 'meeting', 'deliverable'].includes(item.type) ? item.type : 'task';
        const autoTag = type === 'meeting' ? '会议' : type === 'deliverable' ? '交付物' : null;
        let datetime = item.datetime || (item.date ? item.date + 'T09:00' : '');
        await db.add('workItems', {
          projectId: defaultProj,
          type: type,
          title: item.text || '未命名',
          note: '',
          datetime: datetime ? new Date(datetime).toISOString() : '',
          reminderMinutes: item.reminderMinutes || (type === 'meeting' ? 15 : 0),
          done: false, doneAt: null,
          tags: autoTag ? [autoTag, 'AI'] : ['AI'],
          fileIds: [],
        });
      }
    }
    showToast('AI 结构化内容已填入', 'success');
    $('#aiResult').innerHTML = '';
    $('#aiInput').value = '';
    app._aiParsed = null;
    await this.refreshData();
  },

  // ---- AI 进展整理：长文本 → 项目时间轴/待办 ----
  async processProgressAI() {
    const input = $('#progressInput').value.trim();
    if (!input) { showToast('请先粘贴进展内容', 'warning'); return; }
    const pid = parseInt($('#progressProject').value, 10);
    const resultDiv = $('#progressResult');
    resultDiv.innerHTML = '<div class="card p-4"><div class="flex items-center gap-2 text-sm text-slate-500"><div class="ai-loading"></div> AI 拆解中...</div></div>';
    let items = [];
    try {
      const apiKey = await db.getSetting('apiKey', '');
      if (apiKey) {
        const today = dateToStr(new Date());
        const sys = '你是工作进展整理助手。把用户粘贴的项目进展文本拆解为结构化记录，只输出纯JSON：{"items":[{"type":"task|meeting|deliverable","title":"不超过30字","note":"该条的完整细节","date":"YYYY-MM-DD，文本没有明确日期则为空字符串","done":true或false}]}。规则：已经发生或完成的记录 done=true；待办、跟进中、计划中的事项 done=false；会议、汇报、演示、拜访、评审归为 meeting；方案、报告、标书等交付物归为 deliverable；其余为 task。相对日期（如"下周二"）以今天 ' + today + ' 为基准换算。不要输出JSON以外的任何内容。';
        const response = await callAI([{ role: 'user', content: '进展文本：\n' + input }], null, sys);
        const start = response.indexOf('{');
        const end = response.lastIndexOf('}');
        const json = JSON.parse(start !== -1 && end > start ? response.substring(start, end + 1) : response);
        items = (json.items || []).filter(it => it && it.title);
      } else {
        await new Promise(r => setTimeout(r, 500));
        items = this._localProgressParse(input);
      }
    } catch (e) {
      items = this._localProgressParse(input);
      showToast('AI 解析失败，已用本地规则拆解：' + e.message, 'warning');
    }
    if (!items.length) { resultDiv.innerHTML = '<div class="card p-4 text-sm text-slate-400">没有拆解出有效条目，换一段文本试试</div>'; return; }
    this._progressParsed = { items: items, projectId: pid };
    const typeLabels = { task: '事项', meeting: '会议', deliverable: '交付物' };
    const typeCls = { task: 'bg-blue-50 text-blue-600', meeting: 'bg-purple-50 text-purple-600', deliverable: 'bg-orange-50 text-orange-600' };
    const projName = this.projectName(pid);
    let html = '<div class="card p-5 fade-in">';
    html += '<h3 class="font-semibold text-slate-800 mb-1">拆解结果（' + items.length + ' 条）</h3>';
    html += '<p class="text-xs text-slate-400 mb-3">将写入项目：<span class="text-indigo-600 font-medium">' + escapeHtml(projName) + '</span></p>';
    html += '<div class="space-y-2 max-h-80 overflow-y-auto">';
    items.forEach(it => {
      const t = ['task', 'meeting', 'deliverable'].includes(it.type) ? it.type : 'task';
      html += '<div class="p-3 rounded-lg bg-slate-50">';
      html += '<div class="flex items-center gap-2 flex-wrap">';
      html += '<span class="tag ' + typeCls[t] + ' text-[10px]">' + typeLabels[t] + '</span>';
      html += '<span class="text-sm text-slate-700 font-medium">' + escapeHtml(it.title) + '</span>';
      if (it.date) html += '<span class="text-xs text-slate-400">' + escapeHtml(it.date) + '</span>';
      html += it.done ? '<span class="done-label"><i class="fa-solid fa-check"></i>已完成</span>' : '<span class="tag bg-indigo-50 text-indigo-500 text-[10px]">待办</span>';
      html += '</div>';
      if (it.note) html += '<p class="text-xs text-slate-500 mt-1 leading-relaxed">' + escapeHtml(it.note) + '</p>';
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="flex gap-2 mt-4">';
    html += '<button onclick="app.applyProgressAI()" class="btn-primary flex-1 py-2 rounded-lg text-sm">确认写入项目</button>';
    html += '<button onclick="document.getElementById(\'progressResult\').innerHTML=\'\'" class="btn-ghost px-4 py-2 rounded-lg text-sm">取消</button>';
    html += '</div></div>';
    resultDiv.innerHTML = html;
  },

  _localProgressParse(input) {
    // 无 API Key 时的兜底：按行/序号切分，含"待办|跟进|计划|预计|下周"的视为待办
    const items = [];
    const lines = input.split(/\n+/).map(s => s.replace(/^\s*[\d]+[.、)]?\s*|^\s*[-•·]\s*/, '').trim()).filter(s => s.length >= 4);
    for (const s of lines) {
      const pending = /待办|跟进|计划|预计|下周|待提供|待确认|协调/.test(s);
      const isMeeting = /会议|汇报|演示|拜访|评审|交流/.test(s);
      items.push({
        type: isMeeting ? 'meeting' : 'task',
        title: s.length > 30 ? s.slice(0, 30) + '…' : s,
        note: s, date: '', done: !pending
      });
    }
    return items.slice(0, 30);
  },

  async applyProgressAI() {
    const parsed = this._progressParsed;
    if (!parsed || !parsed.items.length) return;
    for (const it of parsed.items) {
      const type = ['task', 'meeting', 'deliverable'].includes(it.type) ? it.type : 'task';
      const autoTag = type === 'meeting' ? '会议' : type === 'deliverable' ? '交付物' : null;
      await db.add('workItems', {
        projectId: parsed.projectId,
        type: type,
        title: it.title,
        note: it.note || '',
        datetime: it.date ? it.date + 'T10:00' : '',
        reminderMinutes: 0,
        done: !!it.done,
        doneAt: it.done ? (it.date ? it.date + 'T18:00' : new Date().toISOString()) : null,
        tags: (autoTag ? [autoTag] : []).concat(['进展']),
        fileIds: [],
      });
    }
    showToast('已写入 ' + parsed.items.length + ' 条到「' + this.projectName(parsed.projectId) + '」', 'success');
    this._progressParsed = null;
    $('#progressResult').innerHTML = '';
    $('#progressInput').value = '';
    await this.refreshData();
  },

  async generateBrief(period) {
    const resultDiv = $('#aiResult');
    resultDiv.innerHTML = '<div class="card p-4"><div class="flex items-center gap-2 text-sm text-slate-500"><div class="ai-loading"></div> 生成' + (period === 'week' ? '本周' : '本月') + '简报中...</div></div>';
    try {
      const now = new Date();
      const startDate = period === 'week' ? new Date(now.getTime() - 7 * 86400000) : new Date(now.getFullYear(), now.getMonth(), 1);
      const startStr = dateToStr(startDate);
      const inPeriod = this.data.workItems.filter(i => {
        const d = i.datetime ? dayStrOf(i.datetime) : (i.createdAt ? dayStrOf(i.createdAt) : '');
        return d && d >= startStr;
      });
      const total = inPeriod.length;
      const done = inPeriod.filter(i => i.done).length;
      const meetings = inPeriod.filter(i => i.type === 'meeting').length;
      const delivs = inPeriod.filter(i => i.type === 'deliverable').length;
      const pendingAll = this.data.workItems.filter(i => !i.done);

      const byProject = {};
      inPeriod.forEach(i => {
        const name = this.projectName(i.projectId);
        byProject[name] = byProject[name] || { total: 0, done: 0 };
        byProject[name].total++;
        if (i.done) byProject[name].done++;
      });

      const apiKey = await db.getSetting('apiKey', '');
      if (apiKey && total > 0) {
        let dataText = '';
        dataText += '统计：事项总数 ' + total + '，已完成 ' + done + '，会议 ' + meetings + ' 场，交付物 ' + delivs + ' 个\n';
        dataText += '分项目：' + Object.keys(byProject).map(k => k + '(' + byProject[k].done + '/' + byProject[k].total + ')').join('，') + '\n\n';
        dataText += '明细：\n';
        inPeriod.forEach(i => {
          dataText += (i.done ? '[已完成]' : '[未完成]') + '【' + this.projectName(i.projectId) + '】' + (TYPE_META[i.type] || TYPE_META.task).label + '：' + i.title + (i.datetime ? ' @' + fmtDateTime(i.datetime) : '') + '\n';
        });
        const prompt = '请根据以下' + (period === 'week' ? '本周' : '本月') + '工作数据生成简洁直观的工作简报。\n\n' + dataText;
        const summary = await callAI([{ role: 'user', content: prompt }], null, AI_SYSTEM_PROMPT_BRIEF);
        let html = '<div class="card p-5 fade-in"><div class="flex items-center justify-between mb-3"><h3 class="font-semibold text-slate-800">' + (period === 'week' ? '本周' : '本月') + '工作简报</h3><span class="text-xs text-slate-400">' + startStr + ' ~ ' + todayStr() + '</span></div>';
        html += '<div class="text-sm text-slate-600 leading-relaxed whitespace-pre-wrap">' + escapeHtml(summary) + '</div>';
        html += '<div class="mt-4 flex gap-3 text-xs text-slate-500 flex-wrap">';
        html += '<span class="tag bg-green-50 text-green-600">完成 ' + done + '/' + total + '</span>';
        html += '<span class="tag bg-purple-50 text-purple-600">会议 ' + meetings + '</span>';
        html += '<span class="tag bg-orange-50 text-orange-600">交付物 ' + delivs + '</span>';
        html += '</div></div>';
        resultDiv.innerHTML = html;
      } else {
        await new Promise(r => setTimeout(r, 600));
        let html = '<div class="card p-5 fade-in"><h3 class="font-semibold text-slate-800 mb-3">' + (period === 'week' ? '本周' : '本月') + '工作简报</h3>';
        html += '<div class="space-y-3 text-sm text-slate-600">';
        html += '<p>📊 <strong>事项完成：</strong>' + done + ' / ' + total + ' 项（' + (total > 0 ? Math.round(done / total * 100) : 0) + '%）</p>';
        html += '<p>🤝 <strong>会议：</strong>' + meetings + ' 场 · 📦 <strong>交付物：</strong>' + delivs + ' 个 · ⏳ <strong>待办：</strong>' + pendingAll.length + ' 项</p>';
        if (Object.keys(byProject).length) {
          html += '<div class="mt-2"><p class="font-medium text-slate-700 mb-1">分项目进展：</p><ul class="space-y-1">';
          Object.keys(byProject).forEach(k => { html += '<li>· ' + escapeHtml(k) + '：' + byProject[k].done + '/' + byProject[k].total + ' 完成</li>'; });
          html += '</ul></div>';
        }
        html += '</div>';
        html += '<div class="mt-4 p-3 bg-slate-50 rounded-lg text-xs text-slate-500">';
        if (!apiKey) html += '⚠️ 未配置 API Key，当前为本地统计简报。在设置中配置 Kimi API Key 后可生成更智能的 AI 分析简报。';
        else html += '💡 数据量较少，AI 生成效果有限。';
        html += '</div></div>';
        resultDiv.innerHTML = html;
      }
    } catch (e) {
      resultDiv.innerHTML = '<div class="card p-4 text-sm text-red-500">简报生成失败: ' + escapeHtml(e.message) + '</div>';
    }
  },

  // ===================== QUICK ADD =====================
  showQuickAdd() {
    const tabs = [['task', '事项'], ['meeting', '会议'], ['memo', '备忘']];
    let html = '<h3 class="text-lg font-bold text-slate-800 mb-4">快速记录</h3>';
    html += '<div class="space-y-3 w-96 max-w-full">';
    html += '<div class="flex gap-2">';
    tabs.forEach(t => {
      html += '<button onclick="app.setQuickAddType(\'' + t[0] + '\')" class="quick-tab flex-1 py-1.5 rounded-lg text-xs font-medium border ' + (app.quickAddType === t[0] ? 'bg-indigo-50 border-indigo-300 text-indigo-700' : 'border-slate-200 text-slate-500') + '">' + t[1] + '</button>';
    });
    html += '</div>';
    html += '<textarea id="quickInput" class="input-field text-sm" rows="4" placeholder="输入内容，如：明天下午3点跟客户开方案评审会..." autofocus></textarea>';

  },

  setQuickAddType(type) {
    app.quickAddType = type;
    app.showQuickAdd();
  },

  async submitQuickAdd() {
    const text = $('#quickInput').value.trim();
    if (!text) return;
    const useAI = $('#quickAIParse') && $('#quickAIParse').checked;
    const defaultProj = this.specialProjectId('事务性工作');

    if (useAI) {
      const apiKey = await db.getSetting('apiKey', '');
      if (apiKey) {
        try {
          closeModal();
          showToast('AI 解析中...', 'info');
          const prompt = '用户输入：' + text + '\n\n请解析为结构化事项。如果包含多个任务请拆分为多个item。';
          const response = await callAI([{ role: 'user', content: prompt }], null, AI_SYSTEM_PROMPT_PARSE);
          let parsed = [];
          try {
            const start = response.indexOf('{');
            const end = response.lastIndexOf('}');
            const json = JSON.parse(start !== -1 && end > start ? response.substring(start, end + 1) : response);
            if (json.items) parsed = json.items;
          } catch (e) { parsed = []; }
          if (parsed.length) {
            this._aiParsed = parsed;
            await this.applyAIResult();
            showToast('AI 已解析并添加 ' + parsed.length + ' 项', 'success');
            return;
          }
        } catch (e) { showToast('AI 解析失败，使用普通模式', 'warning'); }
      }
    }

    if (app.quickAddType === 'memo') {
      await db.add('memos', { title: text.slice(0, 20), content: text, tags: [], pinned: false });
    } else {
      const local = parseScheduleLocal(text);
      const isMeeting = app.quickAddType === 'meeting' || /会议|开会|拜访|沟通会/.test(text);
      const hasTime = /今天|明天|后天|下周|\d{1,2}月|\d{1,2}[点:：]/.test(text);
      await db.add('workItems', {
        projectId: defaultProj,
        type: isMeeting ? 'meeting' : 'task',
        title: local.title || text.slice(0, 30),
        note: text,
        datetime: hasTime ? new Date(local.datetime).toISOString() : '',
        reminderMinutes: isMeeting ? (local.reminderMinutes || 15) : 0,
        done: false, doneAt: null,
        tags: isMeeting ? ['会议'] : [],
        fileIds: [],
      });
    }

  async runCustomerImport() {
    const pack = this._customerPack;
    if (!pack) return;
    const scope = (document.querySelector('input[name="custScope"]:checked') || {}).value || 'key';
    const list = pack.customers.filter(c => scope === 'all' ? true : scope === 'active' ? c.active : (c.stage === 'POC' || c.stage === '交付'));
    closeModal();
    showToast('正在导入 ' + list.length + ' 个客户项目...', 'info');
    const r = await this._applyCustomerPack(list, {});
    showToast('导入完成：新建项目 ' + r.projAdded + ' 个，沟通记录 ' + r.itemAdded + ' 条，归档事项 ' + r.reassigned + ' 条', 'success');
    this.navigate('projects');
  },

  // 客户数据包 → 项目/时间轴/归档（导入与拉取同步共用）
  // list: 需要确保存在的客户（不存在则建项目）；opts.updateExisting: 是否回写阶段；opts.stageSyncList: 阶段回写覆盖的客户范围
  async _applyCustomerPack(list, opts) {
    opts = opts || {};
    const updateExisting = !!opts.updateExisting;
    const stageSyncList = opts.stageSyncList || list;
    let projAdded = 0, itemAdded = 0, reassigned = 0, stageUpdated = 0;

    const byName = {};
    this.data.projects.forEach(p => { byName[p.name] = p.id; });

    // 阶段回写：仅当用户没有手动改过阶段（stage === stageSynced）时才跟随全景图
    if (updateExisting) {
      for (const c of stageSyncList) {
        const pid = byName[c.name];
        if (pid === undefined) continue;
        const p = await db.get('projects', pid);
        if (!p) continue;
        if (p.stageSynced === undefined || p.stageSynced === null) {
          p.stageSynced = p.stage || c.stage || '';   // 老项目只建立基线，不动用户的阶段
          await db.put('projects', p);
        } else if (p.stage === p.stageSynced && c.stage && p.stage !== c.stage) {
          p.stage = c.stage;
          p.stageSynced = c.stage;
          await db.put('projects', p);
          stageUpdated++;
        }
      }
      await this.refreshData();
    }

    // 建项目（已存在则复用，不覆盖任何手动修改）
    const custProjects = [];
    for (const c of list) {
      let pid = byName[c.name];
      if (pid === undefined) {
        pid = await db.add('projects', {
          name: c.name, special: false, stage: c.stage || '',
          industry: c.industry || '', region: c.region || '',
          contact: c.contact || '', owner: c.owner || '', stageRaw: c.stageRaw || '',
          panoramaId: (c.pid !== undefined ? c.pid : null), stageSynced: c.stage || ''
        });
        byName[c.name] = pid;
        projAdded++;
      }
      custProjects.push({ cust: c, projectId: pid });
    }
    await this.refreshData();

    // 沟通记录 → 项目时间轴（已完成状态，dedupe 按 日期+标题）
    for (const cp of custProjects) {
      const existing = new Set(this.data.workItems.filter(i => i.projectId === cp.projectId).map(i => (i.datetime || '').slice(0, 10) + '|' + i.title));
      for (const t of (cp.cust.timeline || [])) {
        if (!t.date || !t.text) continue;
        const title = t.text.length > 30 ? t.text.slice(0, 30) + '…' : t.text;
        const key = t.date + '|' + title;
        if (existing.has(key)) continue;
        existing.add(key);
        const isMeeting = /拜访|会议|开会|沟通|交流|汇报|座谈/.test(t.text);
        await db.add('workItems', {
          projectId: cp.projectId, type: isMeeting ? 'meeting' : 'task',
          title: title, note: t.text, datetime: t.date + 'T10:00', reminderMinutes: 0,
          done: true, doneAt: t.date + 'T18:00',
          tags: (isMeeting ? ['会议'] : []).concat(['沟通记录']), fileIds: []
        });
        itemAdded++;
      }
    }
    await this.refreshData();

    // 关键词归档：仅移动仍在旧版日常项目里的事项；这些项目本身已完全可编辑/删除
    const specialIds = this.data.projects.filter(p => SPECIAL_PROJECTS.includes(p.name)).map(p => p.id);
    const matchers = [];
    for (const cp of custProjects) {
      for (const kw of (cp.cust.keywords || [])) {
        if (kw && kw.length >= 2) matchers.push({ kw: kw, projectId: cp.projectId });
      }
    }
    matchers.sort((a, b) => b.kw.length - a.kw.length); // 长关键词优先，避免“电信”抢走“电信政企”
    for (const it of this.data.workItems) {
      if (!specialIds.includes(it.projectId)) continue;
      const hay = it.title + ' ' + (it.note || '') + ' ' + (it.tags || []).join(' ');
      const m = matchers.find(mm => hay.includes(mm.kw));
      if (m) {
        it.projectId = m.projectId;
        await db.put('workItems', it);
        reassigned++;
      }
    }
    await this.refreshData();
    return { projAdded: projAdded, itemAdded: itemAdded, reassigned: reassigned, stageUpdated: stageUpdated };
  },

    if (res) res.innerHTML = '<p class="text-xs text-slate-400 py-2"><i class="fa-solid fa-spinner fa-spin mr-1"></i>正在从全景图提取最新客户数据...</p>';

      const resp2 = await fetch('customer-projects.json?ts=' + Date.now());
      if (!resp2.ok) throw new Error('customer-projects.json 读取失败');
      const pack = await resp2.json();
      const activeList = pack.customers.filter(c => c.active);
      const counts = await this._applyCustomerPack(activeList, { updateExisting: true, stageSyncList: pack.customers });

    } catch (e) {
      if (res) res.innerHTML = '<div class="text-xs bg-red-50 text-red-600 rounded-lg p-3 leading-relaxed">拉取失败：' + escapeHtml(e.message) + '<br>请确认 WorkMemo 是通过 serve.py 或 proxy-server.mjs 启动的（直接双击 HTML 打开不支持同步），且全景图 HTML 在 DIP 工作区。</div>';

  async syncToPanorama() {
    const res = $('#syncResult');
    if (res) res.innerHTML = '<p class="text-xs text-slate-400 py-2"><i class="fa-solid fa-spinner fa-spin mr-1"></i>正在推送...</p>';
    const REVERSE = { '前期沟通': '初步接触', 'POC': '需求沟通中', '方案': '需求沟通中', '磋商谈判': '需求沟通中', '合同': '需求沟通中', '交付': '签约交付', '运维': '签约交付' };
    const OV_KEY = 'dipMapV2.overlay.v1';
    let ov;
    try { ov = JSON.parse(localStorage.getItem(OV_KEY) || '{}') || {}; } catch (e) { ov = {}; }
    ov.addedCustomers = ov.addedCustomers || [];
    ov.addedRecords = ov.addedRecords || {};

    const lastBack = await db.getSetting('lastPanoramaSyncBack', '');
    const today = new Date().toISOString().slice(0, 10);
    let nextId = Math.max(1000, 0);
    ov.addedCustomers.forEach(c => { if ((c.id || 0) >= nextId) nextId = c.id + 1; });

    let newCust = 0, newRec = 0, stageNote = 0;
    const regionGroupOf = (region, name) => {
      const s = (region || '') + '|' + (name || '');
      const map = [[/北京/, '北京'], [/上海|江苏|浙江|无锡|南京|温州|绍兴|杭州|南通|丽水/, '华东'], [/广州|深圳|广东|中山|东莞|福建|惠州|佛山/, '华南'], [/河南|湖北|武汉|湖南|江西/, '华中'], [/成都|四川|重庆/, '西南'], [/山东|济南/, '山东'], [/陕西|新疆/, '西北'], [/沈阳|辽宁|东北/, '东北'], [/泰国|海外/, '海外']];
      for (const m of map) { if (m[0].test(s)) return m[1]; }
      return '其他';
    };

    const projects = this.data.projects;
    for (const p of projects) {
      // ① 新项目 → 全景图新增客户
      let pid = p.panoramaId;
      if (pid === undefined || pid === null) {
        pid = nextId++;
        const raw = REVERSE[p.stage] || '待交流';
        ov.addedCustomers.push({
          id: pid, name: p.name,
          industry: p.industry || '', region: p.region || '',
          contact: p.contact || '', owner: p.owner || '', sales: '',
          score: null, scoreText: '未评估', stageRaw: raw, quote: '',
          stage: raw, health: '⚪', healthText: '待定', cluster: p.industry || '其他',
          abbr: (p.name || '').replace(/^(北京|上海|广州|深圳|无锡|浙江|江苏|山东|成都|福建)/, '').slice(0, 2) || (p.name || '').slice(0, 2),
          research: { profile: '', pains: [], note: '来自 WorkMemo 的项目，待补充调研' },
          dipScenes: [], regionGroup: regionGroupOf(p.region, p.name),
          keyAccount: false, lastContact: '', timeline: []
        });
        p.panoramaId = pid;
        p.stageSynced = p.stage || '';
        await db.put('projects', p);
        newCust++;
      } else {
        // 已推送过的客户：若用户手动改了阶段，同步更新 overlay 里的新增客户，并留一条阶段记录
        const oc = ov.addedCustomers.find(c => String(c.id) === String(pid));
        if (p.stageSynced !== undefined && p.stageSynced !== null && p.stage !== p.stageSynced) {
          if (oc) { const raw = REVERSE[p.stage] || oc.stage; oc.stage = raw; oc.stageRaw = raw; }
          const recs = (ov.addedRecords[pid] = ov.addedRecords[pid] || []);
          const note = { date: today, need: '阶段更新：' + (p.stageSynced || '未设') + ' → ' + (p.stage || '未设'), progress: '', memo: '来自 WorkMemo' };
          if (!recs.find(r => r.date === note.date && r.need === note.need)) { recs.push(note); stageNote++; }
          p.stageSynced = p.stage || '';
          await db.put('projects', p);
        }
      }

      // ② 增量事项 → 全景图时间轴（跳过全景图导入来的「沟通记录」，避免回环）
      const recs = (ov.addedRecords[pid] = ov.addedRecords[pid] || []);
      const items = this.itemsOf(p.id).filter(i =>
        i.datetime &&
        !(i.tags || []).includes('沟通记录') &&
        (!lastBack || (i.createdAt || '') > lastBack));
      for (const i of items) {
        const rec = {
          date: i.datetime.slice(0, 10),
          need: (i.type === 'meeting' ? '【会议】' : i.type === 'deliverable' ? '【交付物】' : '') + i.title,
          progress: (i.note || '').slice(0, 200),
          memo: '来自 WorkMemo' + (i.done ? '（已完成）' : '')
        };
        if (!recs.find(r => r.date === rec.date && r.need === rec.need)) { recs.push(rec); newRec++; }
      }
    }

    localStorage.setItem(OV_KEY, JSON.stringify(ov));
    await db.setSetting('lastPanoramaSyncBack', new Date().toISOString());
    await this.refreshData();

    // 同时下载协同包 JSON（兼容全景图「协同 → 导入协同包」）
    const blob = new Blob([JSON.stringify(ov, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'DIP客户全景协同包_' + today.replace(/-/g, '') + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);

    if (res) res.innerHTML = '<div class="text-xs bg-green-50 text-green-700 rounded-lg p-3 leading-relaxed">推送完成：新增客户 ' + newCust + ' 个，时间轴记录 ' + newRec + ' 条，阶段更新 ' + stageNote + ' 条。已写入浏览器本地增量区，并下载了协同包 JSON。<br><span class="text-green-600/70">从 <a href="/panorama" target="_blank" class="underline">/panorama</a> 打开全景图即可看到；其他浏览器用刚下载的协同包导入。</span></div>';
  },

  async saveSettings() {

  // ===================== APPLE CALENDAR SYNC =====================
  _calSyncTimer: null,

  maybeCalendarSync() {
    if (this._calSyncTimer) clearTimeout(this._calSyncTimer);
    this._calSyncTimer = setTimeout(() => this.pushCalendarSync(false), 2500);
  },

  _collectCalEvents() {
    return this.data.workItems
      .filter(i => i.datetime && i.type !== 'deliverable' && !(i.tags || []).some(t => t === '进展' || t === '周总结'))
      .map(i => {
        const start = new Date(i.datetime);
        const end = new Date(start.getTime() + 60 * 60000);
        return {
          uid: 'wm-' + i.id,
          title: (i.done ? '✅ ' : '') + (i.type === 'meeting' ? '【会议】' : '') + i.title,
          start: start.toISOString(),
          end: end.toISOString(),
          note: [this.projectName(i.projectId), i.note || ''].filter(Boolean).join('\n'),
          done: !!i.done,
        };
      });
  },

  async pushCalendarSync(manual) {
    const enabled = await db.getSetting('calSyncEnabled', false);
    if (!manual && !enabled) return { ok: false, skipped: true };
    if (manual) showToast('正在同步到苹果日历…（首次同步需等授权弹窗）', 'info');
    try {
      const events = this._collectCalEvents();
      const resp = await fetch('/api/calendar/sync', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ calendarName: 'WorkMemo', events }),
      });
      const r = await resp.json();
      if (manual) {
        if (r.ok) showToast('已同步到苹果日历：新增 ' + r.created + ' / 更新 ' + r.updated + ' / 删除 ' + r.deleted, 'success');
        else if (r.error === 'TIMEOUT') showToast('授权弹窗等待超时——请重新点「立即同步」，并在 Mac 弹出的窗口中点「允许」（订阅源已生成）', 'warning');
        else showToast('日历写入失败：' + (r.error || '未知错误') + '（订阅源不受影响）', 'error');
      }
      return r;
    } catch (e) {
      if (manual) showToast('同步请求失败：' + e.message, 'error');
      return { ok: false, error: e.message };
    }
  },

  async toggleCalSync(on) {
    await db.setSetting('calSyncEnabled', on);
    showToast(on ? '苹果日历同步已开启' : '苹果日历同步已关闭', 'success');
    if (on) { const r = await this.pushCalendarSync(true); await this.refreshCalStatus(); }

  async refreshCalStatus() {
    const el = $('#calSyncStatus');
    if (!el) return;
    try {
      const r = await (await fetch('/api/calendar/status')).json();
      let txt;
      if (r.ok) txt = '✅ 日历访问正常' + (r.hasWorkMemo ? '（已有「WorkMemo」日历）' : '（首次同步会自动创建「WorkMemo」日历）');
      else if (r.error === 'TIMEOUT') txt = '⏳ 状态探测超时，请稍候点「刷新状态」';
      else txt = '⚠️ ' + (r.error || '日历不可用');
      if (r.lanIps && r.lanIps.length) {
        txt += '<br>iPhone 只读订阅（同一 Wi-Fi）：<code class="bg-slate-100 px-1 rounded select-all">webcal://' + r.lanIps[0] + ':' + (r.port || 8848) + '/workmemo.ics</code>';
      }
      el.innerHTML = txt;
    } catch (e) {
      el.textContent = '⚠️ 无法连接本地服务（8848），请确认服务已启动';
    }
  },

  blobToBase64(blob) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(',')[1] || '');
      r.onerror = () => rej(r.error);
      r.readAsDataURL(blob);
    });
  },

  base64ToBlob(b64, mime) {
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime || 'application/octet-stream' });
  },

  async buildExportData() {
    const files = await db.getAll('files');
    const filesOut = [];
    for (const f of files) {
      filesOut.push({
        id: f.id, itemId: f.itemId, name: f.name, mime: f.mime, size: f.size,
        base64: f.blob ? await this.blobToBase64(f.blob) : ''
      });
    }
    return {
      version: 4,
      schema: 'workmemo.backup',
      schemaVersion: 4,
      appVersion: '3.2',
      legacyCompatible: true,
      projects: await db.getAll('projects'),
      workItems: await db.getAll('workItems'),
      memos: await db.getAll('memos'),
      schedules: await db.getAll('schedules'),
      dailyPlans: await db.getAll('dailyPlans'),
      workLogs: await db.getAll('workLogs'),
      versions: await db.getAll('versions'),
      reports: await db.getAll('reports').catch(() => []),
      files: filesOut,
      exportedAt: new Date().toISOString()
    };
  },

  async exportData() {
    showToast('正在打包数据（含附件 base64）...', 'info');
    try {
      const data = await this.buildExportData();
      const json = JSON.stringify(data, null, 2);
      if (json.length > 200 * 1024 * 1024) showToast('备份超过 200MB，文件较大请耐心等待下载', 'warning');
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'workmemo-backup-' + todayStr() + '.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('数据已导出（含 ' + (data.files ? data.files.length : 0) + ' 个附件）', 'success');
    } catch (e) {
      showToast('导出失败: ' + e.message, 'error');
    }
  },

  async exportCSV() {
    let csv = '类型,项目,日期时间,标题,状态,标签,备注\n';
    this.data.workItems.forEach(i => {
      csv += (TYPE_META[i.type] || TYPE_META.task).label + ',' + csvCell(this.projectName(i.projectId)) + ',' + (i.datetime ? fmtDateTime(i.datetime) : fmtDate(i.createdAt)) + ',' + csvCell(i.title) + ',' + (i.done ? '已完成' : '待办') + ',' + csvCell((i.tags || []).join(' ')) + ',' + csvCell(i.note || '') + '\n';
    });
    this.data.memos.forEach(m => csv += '备忘,,' + fmtDate(m.updatedAt) + ',' + csvCell(m.title) + ',,' + csvCell((m.tags || []).join(' ')) + ',\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');

  async importData(input) {
    const file = input.files[0];
    if (!file) return;
    const text = await file.text();
    let data;
    try { data = JSON.parse(text); }
    catch (e) { showToast('导入失败：文件格式错误', 'error'); input.value = ''; return; }
    if (typeof data !== 'object' || !data) { showToast('导入失败：内容不是有效 JSON 对象', 'error'); input.value = ''; return; }

    const counts = {};
    const previewData = this.normalizeImportData(data);
    const stores = ['projects', 'workItems', 'memos', 'schedules', 'dailyPlans', 'workLogs', 'reports'];
    for (const s of stores) if (Array.isArray(previewData[s])) counts[s] = previewData[s].length;
    if (Array.isArray(data.files)) counts['附件'] = data.files.length;
    else if (Array.isArray(data.filesMeta)) counts['附件(仅清单)'] = data.filesMeta.length;
    if (!Object.keys(counts).length) { showToast('导入失败：未找到可导入的数据', 'error'); input.value = ''; return; }

    const summary = Object.keys(counts).map(k => k + ': ' + counts[k] + ' 条').join('\n');
    const legacyHint = previewData._legacyConverted ? '\n旧版日程/计划会额外转换为新版事项，原始 dailyPlans / schedules 仍会保留。' : '';
    if (!await this.confirmModal({ title: '确认导入', message: '将追加导入以下数据：\n' + summary + legacyHint + '\n（同名项目会合并，不会覆盖现有数据）' })) { input.value = ''; return; }

    try {
      const result = await this.importDataObject(data);
      showToast('导入完成：' + result, 'success');
    } catch (e) {
      showToast('导入失败: ' + e.message, 'error');
    }
    input.value = '';
    await this.refreshData();
    this.loadPage(this.page);
  },

  // 将旧版（dailyPlans / schedules 为主）备份补齐为 v3 事项，同时保留原表，
  // 这样 WorkMemo_v2 仍可读取历史记录，v3 则能在项目泳道中继续使用。
  normalizeImportData(data) {
    const out = Object.assign({}, data);
    const legacy = Number(data.version || 0) < 3 || (!Array.isArray(data.projects) && !Array.isArray(data.workItems));
    if (!legacy) return out;
    out.projects = Array.isArray(out.projects) ? out.projects.slice() : [];
    out.workItems = Array.isArray(out.workItems) ? out.workItems.slice() : [];
    const projectIds = { product: '__legacy_product__', ningde: '__legacy_ningde__', zhongyuan: '__legacy_zhongyuan__' };
    const now = new Date().toISOString();
    const ensureProject = (id, name) => {
      if (!out.projects.some(p => p && p.name === name)) out.projects.push({ id, name, special: false, stage: '', priority: '', createdAt: now });
    };
    ensureProject(projectIds.product, '产品研发');
    ensureProject(projectIds.ningde, '宁德时代');
    ensureProject(projectIds.zhongyuan, '中源生物');
    const projectFor = (text) => /宁德|姚冲|秋萍|供应链|库存预警/.test(text) ? projectIds.ningde : /中源|小源|褚旭/.test(text) ? projectIds.zhongyuan : projectIds.product;
    const planDates = (Array.isArray(data.dailyPlans) ? data.dailyPlans : []).map(p => p.date).filter(Boolean).sort();
    const latestPlanDate = planDates.length ? planDates[planDates.length - 1] : '';
    const add = (row, sourceType, sourceId, extra) => out.workItems.push(Object.assign({
      projectId: projectFor((row.title || row.text || '') + ' ' + (row.description || row.note || '')),
      type: sourceType === 'schedule' && /会议|开会|拜访|沟通|培训|meeting/i.test((row.title || '') + ' ' + (row.description || '')) ? 'meeting' : 'task',
      title: row.title || row.text || '未命名事项',
      note: row.description || row.note || '',
      datetime: row.datetime || '',
      reminderMinutes: Number(row.reminderMinutes) || 0,
      done: !!row.done,
      doneAt: row.done ? (row.updatedAt || row.completedAt || null) : null,
      historyOnly: false,
      tags: ['计划导入'],
      fileIds: [],
      createdAt: row.createdAt || now,
      updatedAt: row.updatedAt || row.createdAt || now,
      importSource: 'legacy:' + sourceType + ':' + sourceId,
      legacySource: { type: sourceType, id: sourceId },
    }, extra || {}));
    // 旧版日程均作为历史日历记录，不再进入当前待办。
    (Array.isArray(data.schedules) ? data.schedules : []).forEach((s, i) => add(s, 'schedule', s.id != null ? s.id : i, {
      done: true, doneAt: s.updatedAt || s.datetime || now, historyOnly: true, tags: ['历史记录', '日程导入'],
    }));
    // 只保留最新日期的未完成项；更早的未完成结转项不再当作当前待办。
    (Array.isArray(data.dailyPlans) ? data.dailyPlans : []).forEach((p, pi) => {
      (Array.isArray(p.items) ? p.items : []).forEach((it, ii) => {
        const sourceId = (p.id != null ? p.id : pi) + ':' + (it.id != null ? it.id : ii);
        if (p.date === latestPlanDate && !it.done) {
          add({
            title: it.text,
            note: it.carriedFrom ? '由 ' + it.carriedFrom + ' 结转' : '',
            datetime: it.datetime || (p.date ? p.date + 'T09:00' : ''),
            done: false,
            createdAt: it.createdAt || p.createdAt,
            updatedAt: it.updatedAt || p.updatedAt,
          }, 'dailyPlan', sourceId, { priority: it.priority || 'normal', tags: ['当前待办', '计划导入'] });
        } else if (it.done) {
          add({
            title: it.text,
            note: it.carriedFrom ? '由 ' + it.carriedFrom + ' 结转' : '',
            datetime: it.completedAt || it.createdAt || (p.date ? p.date + 'T18:00' : ''),
            done: true,
            completedAt: it.completedAt,
            createdAt: it.createdAt || p.createdAt,
            updatedAt: it.updatedAt || p.updatedAt,
          }, 'dailyPlan', sourceId, { priority: it.priority || 'normal', historyOnly: true, doneAt: it.completedAt || it.updatedAt || p.updatedAt || null, tags: ['历史记录', '计划完成'] });
        }
      });
    });
    out._legacyConverted = true;
    return out;
  },

  // 导入核心：项目按名称合并、事项/附件重映射 id（可被测试/其他入口复用）
  async importDataObject(inputData) {
    const data = this.normalizeImportData(inputData);
    const allStores = ['projects', 'workItems', 'memos', 'schedules', 'dailyPlans', 'workLogs', 'reports', 'versions'];
    const existingSources = {};
    const existingRows = {};
    for (const s of allStores) {
      existingRows[s] = await db.getAll(s).catch(() => []);
      existingSources[s] = new Set(existingRows[s].map(r => r.importSource).filter(Boolean));
    }
    const projIdMap = {};
    let projAdded = 0;
    if (Array.isArray(data.projects)) {
      const existing = await db.getAll('projects');
      const byName = {};
      existing.forEach(p => { byName[p.name] = p.id; });
      for (const row of data.projects) {
        if (byName[row.name] !== undefined) { projIdMap[row.id] = byName[row.name]; continue; }
        const copy = Object.assign({}, row);
        delete copy.id;
        const nid = await db.add('projects', copy);
        projIdMap[row.id] = nid;
        byName[row.name] = nid;
        projAdded++;
      }
    }

    const itemIdMap = {};
    const itemFiles = [];
    let itemAdded = 0;
    if (Array.isArray(data.workItems)) {
      for (const row of data.workItems) {
        const copy = Object.assign({}, row);
        const oldId = copy.id;
        if (copy.importSource && existingSources.workItems.has(copy.importSource)) {
          const oldFileIds = Array.isArray(copy.fileIds) ? copy.fileIds.slice() : [];
          const found = existingRows.workItems.find(i => i.importSource === copy.importSource);
          if (found) { itemIdMap[oldId] = found.id; itemFiles.push([found.id, oldFileIds]); }
          continue;
        }
        delete copy.id;
        if (projIdMap[copy.projectId] !== undefined) copy.projectId = projIdMap[copy.projectId];
        const oldFileIds = Array.isArray(copy.fileIds) ? copy.fileIds.slice() : [];
        copy.fileIds = [];
        const nid = await db.add('workItems', copy);
        itemIdMap[oldId] = nid;
        itemFiles.push([nid, oldFileIds]);
        itemAdded++;
      }
    }

    // 附件还原（base64 → Blob）
    const fileIdMap = {};
    let fileAdded = 0;
    if (Array.isArray(data.files)) {
      for (const f of data.files) {
        if (!f.base64) continue;
        const copy = {
          itemId: itemIdMap[f.itemId] !== undefined ? itemIdMap[f.itemId] : f.itemId,
          name: f.name, mime: f.mime, size: f.size,
          blob: this.base64ToBlob(f.base64, f.mime)
        };
        const nid = await db.add('files', copy);
        fileIdMap[f.id] = nid;
        fileAdded++;
      }
      // 回填事项的 fileIds
      for (const pair of itemFiles) {
        const nid = pair[0], oldFileIds = pair[1];
        if (!oldFileIds.length) continue;
        const mapped = oldFileIds.map(x => fileIdMap[x]).filter(x => x !== undefined);
        if (mapped.length) {
          const it = await db.get('workItems', nid);
          if (it) { it.fileIds = mapped; await db.put('workItems', it); }
        }
      }
    }

    // 其余表追加，并记录旧 id → 新 id，供历史版本重映射
    let otherAdded = 0;
    const otherIdMaps = { memos: {}, schedules: {}, dailyPlans: {}, workLogs: {}, reports: {} };
    for (const s of ['memos', 'schedules', 'dailyPlans', 'workLogs', 'reports']) {
      if (!Array.isArray(data[s])) continue;
      for (const row of data[s]) {
        const copy = Object.assign({}, row);
        const oldId = copy.id;
        const source = copy.importSource || 'import:' + (data.exportedAt || 'unknown') + ':' + s + ':' + oldId;
        if (existingSources[s].has(source)) continue;
        copy.importSource = source;
        delete copy.id;
        const nid = await db.add(s, copy);
        otherIdMaps[s][oldId] = nid;
        otherAdded++;
      }
    }
    // 导入历史快照，尽量把 entityId 映射到本次导入生成的新记录。
    let versionsAdded = 0;
    const versionMaps = { project: projIdMap, workItem: itemIdMap, memo: otherIdMaps.memos, schedule: otherIdMaps.schedules, dailyPlan: otherIdMaps.dailyPlans, workLog: otherIdMaps.workLogs };
    if (Array.isArray(data.versions)) {
      for (const row of data.versions) {
        const copy = Object.assign({}, row);
        const source = copy.importSource || 'import:' + (data.exportedAt || 'unknown') + ':version:' + (copy.id != null ? copy.id : versionsAdded);
        if (existingSources.versions.has(source)) continue;
        delete copy.id;
        copy.importSource = source;
        const map = versionMaps[copy.entityType];
        if (map && map[copy.entityId] !== undefined) copy.entityId = map[copy.entityId];
        await db.add('versions', copy);
        versionsAdded++;
      }
    }
    this._dataDirty = true;
    const legacyNote = data._legacyConverted ? '（已将旧版日程/计划转换为新版事项，原表仍保留）' : '';
    return '项目 ' + projAdded + ' 个，事项 ' + itemAdded + ' 条，附件 ' + fileAdded + ' 个，其他 ' + otherAdded + ' 条，历史版本 ' + versionsAdded + ' 条' + legacyNote;
  },

  async clearAllData() {
    if (!await this.confirmModal({ title: '清空数据', message: '此操作将删除所有项目、事项、备忘与文件，且不可恢复。确定继续？', danger: true })) return;
    if (!await this.confirmModal({ title: '再次确认', message: '请输入 DELETE 确认清空', requireInput: 'DELETE', danger: true })) return;
    const stores = ['projects', 'workItems', 'memos', 'schedules', 'dailyPlans', 'workLogs', 'versions', 'files', 'reports', 'leadSheets'];
    for (const s of stores) {
      const all = await db.getAll(s);
      for (const row of all) await db.delete(s, row.id);
    }
    await db.setSetting('v3Migrated', false);
    await db.setSetting('v3MigratedPlanHistory', false);
    showToast('数据已清空', 'success');
    await this.migrateToV3();
    await this.refreshData();
    this.loadPage(this.page);
  },

  },
